          title: Forward to memory-service
          desc: POST /api/v1/agent-tasks/execute；read timeout 600s 以覆盖 OpenClaw 同步执行
          selected: false
          method: post
          url: '{{#env.MEMORY_SERVICE_AGENT_TASK_URL#}}'
