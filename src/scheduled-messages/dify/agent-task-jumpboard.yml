# Personal AI · AgentTask Dify 跳板
# 用途：Jira Automation 不能直连 memory-service 时，经 Dify HTTP 转发到 /api/v1/agent-tasks/execute
#
# 导入后请检查：
# 1. 环境变量 MEMORY_SERVICE_AGENT_TASK_URL
#    默认写死 Dify worker 可达的 NodePort：http://10.32.56.212:3210/...
#    （hostname memory.xmnup.com 对 Dify 不可达；Chrome AR 仍用 .env MEMORY_SERVICE_BASE_URL）
# 2. 环境变量 MEMORY_SERVICE_API_KEY（必填，secret）
#    填 memory-service 全权 API_KEY（所有用户共用这一把，配合 X-User-Id 扮演具体用户）。
#    不要填 pak.… 个人 key，也不要填 BOOTSTRAP_API_KEY。
#    secret 不会随 YAML 带入，必须在 Dify 环境变量里手工粘贴后再 Publish。
# 3. HTTP 节点 Authorization = Bearer {{#env.MEMORY_SERVICE_API_KEY#}}（已写进本 YAML）
# 4. 发布为 Workflow，复制 API Access 的 URL + API Key，回头给我替换 Config / AppScript 包装体
#
# Jira / AppScript 期望调用体（response_mode=blocking）：
# {
#   "inputs": {
#     "payload_json": "<原 agent-tasks/execute JSON 字符串>"
#   },
#   "response_mode": "blocking",
#   "user": "esone.qiu"
# }
#
# 也可直接传扁平字段（payload_json 为空时生效）：taskId / task / title / ...

app:
  description: Jira Automation → Dify → memory-service /agent-tasks/execute 跳板。只转发请求，不改写 task / artifact。
  icon: 🛰️
  icon_background: '#E8F3FF'
  mode: workflow
  name: Personal AI AgentTask Jumpboard
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.1.1
workflow:
  conversation_variables: []
  environment_variables:
    - id: env-memory-agent-task-url
      name: MEMORY_SERVICE_AGENT_TASK_URL
      value: http://10.32.56.212:3210/api/v1/agent-tasks/execute
      value_type: string
      description: memory-service AgentTask execute 完整 URL（Dify 跳板专用 NodePort；非 Chrome .env）
    - id: env-memory-api-key
      name: MEMORY_SERVICE_API_KEY
      value: ''
      value_type: secret
      description: 必填。memory-service 全权 API_KEY（非 pak / 非 bootstrap）；导入后在 Dify 环境变量中填写
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    viewport:
      x: 0
      y: 0
      zoom: 0.7
    edges:
