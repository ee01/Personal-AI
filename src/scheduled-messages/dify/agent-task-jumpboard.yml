            read: 600
            write: 60
          ssl_verify: false
          retry_config:
            enabled: false
            max_retries: 0
            retry_interval: 1000
            exponential_backoff:
              enabled: false
              multiplier: 2
              max_interval: 10000

      - id: '1785472000004'
        type: custom
        width: 260
        height: 120
        position:
          x: 1020
          y: 200
        positionAbsolute:
          x: 1020
          y: 200
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          type: code
          title: Parse Response
          desc: 把 memory-service 响应压成 Jira / 调试可用的扁平输出
          selected: false
          code_language: python3
          variables:
            - variable: normalize_ok
              value_selector:
                - '1785472000002'
                - ok
            - variable: normalize_error
              value_selector:
                - '1785472000002'
                - error
            - variable: task_id
              value_selector:
                - '1785472000002'
                - task_id
            - variable: status_code
              value_selector:
                - '1785472000003'
                - status_code
            - variable: body
              value_selector:
                - '1785472000003'
                - body
          outputs:
            accepted:
              type: string
              children: null
            taskId:
              type: string
              children: null
            actionId:
              type: string
              children: null
            queueStatus:
              type: string
              children: null
            error:
              type: string
              children: null
            statusCode:
              type: string
              children: null
            rawBody:
              type: string
              children: null
          code: |
            import json

            def _trim(value):
                if value is None:
                    return ''
                return str(value).strip()

            def main(
                normalize_ok: str = 'true',
                normalize_error: str = '',
                task_id: str = '',
                status_code: str = '',
                body: str = '',
            ) -> dict:
                if _trim(normalize_ok).lower() != 'true':
                    return {
                        'accepted': 'false',
                        'taskId': _trim(task_id),
                        'actionId': '',
                        'queueStatus': 'failed',
                        'error': _trim(normalize_error) or 'normalize_failed',
                        'statusCode': '0',
                        'rawBody': '',
                    }

                raw = body if isinstance(body, str) else json.dumps(body, ensure_ascii=False)
                parsed = {}
                try:
                    parsed = json.loads(raw) if _trim(raw) else {}
                    if not isinstance(parsed, dict):
                        parsed = {'raw': parsed}
                except Exception:
                    parsed = {}

                error = (
                    _trim(parsed.get('error'))
                    or _trim(parsed.get('detail'))
                    or _trim(parsed.get('message'))
                )
                queue_status = _trim(parsed.get('queueStatus')) or (
                    'succeeded' if str(status_code).startswith('2') and not error else 'failed'
                )
                accepted = 'true' if str(status_code).startswith('2') and _trim(parsed.get('accepted', 'true')).lower() != 'false' else 'false'

                return {
                    'accepted': accepted,
                    'taskId': _trim(parsed.get('taskId')) or _trim(task_id),
                    'actionId': _trim(parsed.get('actionId')),
                    'queueStatus': queue_status,
                    'error': error,
                    'statusCode': _trim(status_code) or '0',
                    'rawBody': raw[:8000],
                }

