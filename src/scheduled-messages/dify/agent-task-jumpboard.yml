        targetPosition: left
        data:
          type: code
          title: Normalize Payload
          desc: 优先使用 payload_json；否则用扁平字段拼装 agent-tasks/execute body
          selected: false
          code_language: python3
          variables:
            - variable: payload_json
              value_selector:
                - '1785472000001'
                - payload_json
            - variable: taskId
              value_selector:
                - '1785472000001'
                - taskId
            - variable: sheetMessageId
              value_selector:
                - '1785472000001'
                - sheetMessageId
            - variable: title
              value_selector:
                - '1785472000001'
                - title
            - variable: task
              value_selector:
                - '1785472000001'
                - task
            - variable: executor
              value_selector:
                - '1785472000001'
                - executor
            - variable: notifyTemplate
              value_selector:
                - '1785472000001'
                - notifyTemplate
            - variable: triggerSource
              value_selector:
                - '1785472000001'
                - triggerSource
            - variable: arBindingId
              value_selector:
                - '1785472000001'
                - arBindingId
            - variable: idempotencyKey
              value_selector:
                - '1785472000001'
                - idempotencyKey
            - variable: userId
              value_selector:
                - '1785472000001'
                - userId
            - variable: notify
              value_selector:
                - '1785472000001'
                - notify
            - variable: source_json
              value_selector:
                - '1785472000001'
                - source_json
            - variable: scheduleSpec_json
              value_selector:
                - '1785472000001'
                - scheduleSpec_json
            - variable: notifyTarget_json
              value_selector:
                - '1785472000001'
                - notifyTarget_json
            - variable: rowIndex
              value_selector:
                - '1785472000001'
                - rowIndex
          outputs:
            request_body:
              type: string
              children: null
            x_user_id:
              type: string
              children: null
            task_id:
              type: string
              children: null
            ok:
              type: string
              children: null
            error:
              type: string
              children: null
          code: |
            import json

            def _trim(value):
                if value is None:
                    return ''
                return str(value).strip()

            def _parse_json_object(raw, field_name):
                text = _trim(raw)
                if not text:
                    return None
                try:
                    data = json.loads(text)
                except Exception as exc:
                    raise ValueError(f'{field_name} is not valid JSON: {exc}') from exc
                if not isinstance(data, dict):
                    raise ValueError(f'{field_name} must be a JSON object')
                return data

            def _parse_bool(raw, default=True):
                text = _trim(raw).lower()
                if not text:
                    return default
                if text in ('1', 'true', 'yes', 'y', 'on'):
                    return True
                if text in ('0', 'false', 'no', 'n', 'off'):
                    return False
                return default

            def main(
                payload_json: str = '',
                taskId: str = '',
                sheetMessageId: str = '',
                title: str = '',
                task: str = '',
                executor: str = '',
                notifyTemplate: str = '',
                triggerSource: str = '',
                arBindingId: str = '',
                idempotencyKey: str = '',
                userId: str = '',
                notify: str = '',
                source_json: str = '',
                scheduleSpec_json: str = '',
                notifyTarget_json: str = '',
                rowIndex: str = '',
            ) -> dict:
                try:
                    body = _parse_json_object(payload_json, 'payload_json')
                    if body is None:
                        body = {}
                        if _trim(taskId):
                            body['taskId'] = _trim(taskId)
                        if _trim(sheetMessageId):
                            body['sheetMessageId'] = _trim(sheetMessageId)
                        if _trim(title):
                            body['title'] = _trim(title)
                        if _trim(task):
                            body['task'] = _trim(task)
                        if _trim(executor):
                            body['executor'] = _trim(executor)
                        if _trim(notifyTemplate):
                            body['notifyTemplate'] = _trim(notifyTemplate)
                        if _trim(triggerSource):
                            body['triggerSource'] = _trim(triggerSource)
                        if _trim(arBindingId):
                            body['arBindingId'] = _trim(arBindingId)
                        if _trim(idempotencyKey):
                            body['idempotencyKey'] = _trim(idempotencyKey)
                        if _trim(userId):
                            body['userId'] = _trim(userId)
                        if _trim(notify):
                            body['notify'] = _parse_bool(notify, True)
                        if _trim(rowIndex):
                            try:
                                body['rowIndex'] = int(_trim(rowIndex))
                            except Exception:
                                body['rowIndex'] = _trim(rowIndex)
                        source = _parse_json_object(source_json, 'source_json')
                        if source is not None:
                            body['source'] = source
                        schedule_spec = _parse_json_object(scheduleSpec_json, 'scheduleSpec_json')
                        if schedule_spec is not None:
                            body['scheduleSpec'] = schedule_spec
                        notify_target = _parse_json_object(notifyTarget_json, 'notifyTarget_json')
                        if notify_target is not None:
                            body['notifyTarget'] = notify_target

                    resolved_task_id = _trim(body.get('taskId')) or _trim(body.get('sheetMessageId'))
                    resolved_task = _trim(body.get('task'))
                    if not resolved_task_id:
                        raise ValueError('taskId is required')
                    if not resolved_task:
                        raise ValueError('task is required')

                    if not _trim(body.get('executor')):
                        body['executor'] = 'openclaw'
                    if not _trim(body.get('triggerSource')):
                        body['triggerSource'] = 'jira_rule'

                    x_user_id = _trim(body.get('userId')) or _trim(userId) or 'default'
                    if not _trim(body.get('userId')):
                        body['userId'] = x_user_id

                    return {
                        'request_body': json.dumps(body, ensure_ascii=False),
                        'x_user_id': x_user_id,
                        'task_id': resolved_task_id,
                        'ok': 'true',
                        'error': '',
                    }
                except Exception as exc:
                    return {
                        'request_body': '{}',
                        'x_user_id': _trim(userId) or 'default',
                        'task_id': _trim(taskId) or _trim(sheetMessageId),
                        'ok': 'false',
                        'error': str(exc),
                    }

