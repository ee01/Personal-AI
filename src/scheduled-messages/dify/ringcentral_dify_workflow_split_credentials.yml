      - data:
          code: |
            import json


            def _key(first, last):
                return ("%s.%s" % (str(first).strip(), str(last).strip())).casefold()


            def _record_key(record):
                return _key(record.get("firstName") or "", record.get("lastName") or "")


            def _email_key(record):
                email = str(record.get("email") or "")
                return email.split("@", 1)[0].casefold() if email else ""


            def _target_key(value):
                target = (value or "").strip()
                if target.startswith("@"):
                    target = target[1:].strip()
                if "@" in target:
                    target = target.split("@", 1)[0]
                if "." not in target:
                    raise Exception("personName must use first.last format: " + (value or ""))
                first, last = target.split(".", 1)
                if not first or not last:
                    raise Exception("personName must use first.last format: " + (value or ""))
                return _key(first, last)


            def _records_from(body):
                data = json.loads(body or "{}")
                return data.get("records") or data.get("contacts") or []


            def main(target_input: str, target_search_body: str, directory_body: str) -> dict:
                target = (target_input or "").strip()
                if not target:
                    raise Exception("chatId or personName is required")

                if target.isdigit():
                    return {
                        "target_type": "chat",
                        "resolved_chat_id": target,
                        "target_person_id": "",
                        "conversation_body": "",
                    }

                wanted = _target_key(target)
                records = _records_from(target_search_body) + _records_from(directory_body)

                matches = []
                for record in records:
                    person_id = record.get("id")
                    if not person_id:
                        continue
                    if _record_key(record) == wanted or _email_key(record) == wanted:
                        matches.append(str(person_id))

                ids = sorted(set(matches))
                if not ids:
                    raise Exception("Cannot resolve target personName: " + target)
                if len(ids) > 1:
                    raise Exception("Multiple directory entries matched target personName: " + target)

                person_id = ids[0]
                return {
                    "target_type": "person",
                    "resolved_chat_id": "",
                    "target_person_id": person_id,
                    "conversation_body": json.dumps({"members": [{"id": person_id}]}, ensure_ascii=False),
                }
          code_language: python3
          desc: Resolve numeric chat id or first.last personName into a target.
          outputs:
            conversation_body:
              children: null
              type: string
            resolved_chat_id:
              children: null
              type: string
            target_person_id:
              children: null
              type: string
            target_type:
              children: null
              type: string
          selected: false
          title: Resolve Target
          type: code
          variables:
            - value_selector:
                - parse_token
                - target_input
              variable: target_input
            - value_selector:
                - target_directory_search
                - body
              variable: target_search_body
            - value_selector:
                - directory_entries
                - body
              variable: directory_body
