            import json


            def main(
                clientId: str,
                clientSecret: str,
                jwt: str,
                chatId: str,
                message_text: str,
            ) -> dict:
                server = "https://platform.ringcentral.com"
                client_id = (clientId or "").strip()
                client_secret = (clientSecret or "").strip()
                jwt_value = (jwt or "").strip()
                target_input = (chatId or "").strip()

                if not client_id:
                    raise Exception("clientId is required")
                if not client_secret:
                    raise Exception("clientSecret is required")
                if not jwt_value:
                    raise Exception("jwt is required")
                if not target_input:
                    raise Exception("chatId or personName is required")

                return {
                    "server": server,
                    "client_id": str(client_id),
                    "client_secret": str(client_secret),
                    "jwt": str(jwt_value),
                    "target_input": str(target_input),
                    "message_text": message_text or "",
                    "directory_record_count": "1000",
                    "mention_map_json": json.dumps({}, ensure_ascii=False),
                    "fail_on_unresolved_mentions": "true",
                }
