      - data:
          code: |
            import json
            import re


            MENTION_RE = re.compile(r"(?<![\w.-])@([A-Za-z][A-Za-z0-9'-]*)\.([A-Za-z][A-Za-z0-9'-]*)\b")


            def _key(first, last):
                return ("%s.%s" % (str(first).strip(), str(last).strip())).casefold()


            def _record_key(record):
                return _key(record.get("firstName") or "", record.get("lastName") or "")


            def _email_key(record):
                email = str(record.get("email") or "")
                return email.split("@", 1)[0].casefold() if email else ""


            def main(
                message_text: str,
                target_search_body: str,
                directory_body: str,
                mention_map_json: str,
                fail_on_unresolved_mentions: str,
            ) -> dict:
                text = message_text or ""
                directory = json.loads(directory_body or "{}")
                target_search = json.loads(target_search_body or "{}")
                records = (
                    (target_search.get("records") or target_search.get("contacts") or [])
                    + (directory.get("records") or directory.get("contacts") or [])
                )
                mention_map = json.loads(mention_map_json or "{}")
                fail_on_unresolved = str(fail_on_unresolved_mentions).lower() != "false"

                by_name = {}
                by_email = {}
                for record in records:
                    person_id = record.get("id")
                    if not person_id:
                        continue
                    name_key = _record_key(record)
                    email_key = _email_key(record)
                    if name_key != ".":
                        by_name.setdefault(name_key, set()).add(str(person_id))
                    if email_key:
                        by_email.setdefault(email_key, set()).add(str(person_id))

                resolved = {}
                unresolved = []
                for match in MENTION_RE.finditer(text):
                    first, last = match.group(1), match.group(2)
                    handle = "@%s.%s" % (first, last)
                    handle_key = _key(first, last)
                    if handle_key in resolved:
                        continue

                    person_id = (
                        mention_map.get(handle_key)
                        or mention_map.get(handle)
                        or mention_map.get(handle.lstrip("@"))
                    )
                    candidates = set()
                    if person_id:
                        candidates.add(str(person_id))
                    candidates.update(by_name.get(handle_key, set()))
                    candidates.update(by_email.get(handle_key, set()))

                    if len(candidates) == 1:
                        resolved[handle_key] = {
                            "handle": handle,
                            "person_id": next(iter(candidates)),
                        }
                    elif len(candidates) > 1:
                        unresolved.append({"handle": handle, "error": "multiple directory entries matched"})
                    else:
                        unresolved.append({"handle": handle, "error": "no directory entry matched"})

                if unresolved and fail_on_unresolved:
                    raise Exception("Unresolved mention(s): " + ", ".join(item["handle"] for item in unresolved))

                def replace(match):
                    item = resolved.get(_key(match.group(1), match.group(2)))
                    if not item:
                        return match.group(0)
                    return "![:Person](%s)" % item["person_id"]

                final_text = MENTION_RE.sub(replace, text)
                return {
                    "post_body": json.dumps({"text": final_text}, ensure_ascii=False),
                    "final_text": final_text,
                    "mentions_json": json.dumps(list(resolved.values()), ensure_ascii=False),
                    "unresolved_mentions_json": json.dumps(unresolved, ensure_ascii=False),
                }
          code_language: python3
          desc: Convert @First.Last to RingCentral ![:Person](id) markdown.
          outputs:
            final_text:
              children: null
              type: string
            mentions_json:
              children: null
              type: string
            post_body:
              children: null
              type: string
            unresolved_mentions_json:
              children: null
              type: string
          selected: false
          title: Prepare Message
          type: code
          variables:
            - value_selector:
                - parse_token
                - message_text
              variable: message_text
            - value_selector:
                - target_directory_search
                - body
              variable: target_search_body
            - value_selector:
                - directory_entries
                - body
              variable: directory_body
            - value_selector:
                - parse_token
                - mention_map_json
              variable: mention_map_json
            - value_selector:
                - parse_token
                - fail_on_unresolved_mentions
              variable: fail_on_unresolved_mentions
