      - id: '1785473000004'
        type: custom
        width: 260
        height: 120
        position:
          x: 1040
          y: 190
        positionAbsolute:
          x: 1040
          y: 190
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          type: code
          title: Parse Response
          desc: 抽出 chatId/postId/sentAt，供 Jira markBotMessageExecuted 使用
          selected: false
          code_language: python3
          variables:
            - variable: normalize_ok
              value_selector:
                - '1785473000002'
                - ok
            - variable: normalize_error
              value_selector:
                - '1785473000002'
                - error
            - variable: channel
              value_selector:
                - '1785473000002'
                - channel
            - variable: status_code
              value_selector:
                - '1785473000003'
                - status_code
            - variable: body
              value_selector:
                - '1785473000003'
                - body
          outputs:
            accepted:
              type: string
              children: null
            channel:
              type: string
              children: null
            status:
              type: string
              children: null
            chatId:
              type: string
              children: null
            groupId:
              type: string
              children: null
            postId:
              type: string
              children: null
            sentAt:
              type: string
              children: null
            error:
              type: string
              children: null
            statusCode:
              type: string
              children: null
            rawBody:
              type: string
              children: null
          code: |
            import json

            def _trim(value):
                if value is None:
                    return ''
                return str(value).strip()

            def _pick(obj, *keys):
                if not isinstance(obj, dict):
                    return ''
                for key in keys:
                    value = obj.get(key)
                    text = _trim(value)
                    if text:
                        return text
                return ''

            def main(
                normalize_ok: str = 'true',
                normalize_error: str = '',
                channel: str = '',
                status_code: str = '',
                body: str = '',
            ) -> dict:
                if _trim(normalize_ok).lower() != 'true':
                    return {
                        'accepted': 'false',
                        'channel': _trim(channel),
                        'status': 'failed',
                        'chatId': '',
                        'groupId': '',
                        'postId': '',
                        'sentAt': '',
                        'error': _trim(normalize_error) or 'normalize_failed',
                        'statusCode': '0',
                        'rawBody': '',
                    }

                raw = body if isinstance(body, str) else json.dumps(body, ensure_ascii=False)
                parsed = {}
                try:
                    parsed = json.loads(raw) if _trim(raw) else {}
                    if not isinstance(parsed, dict):
                        parsed = {}
                except Exception:
                    parsed = {}

                nested = parsed.get('data') if isinstance(parsed.get('data'), dict) else {}
                chat_id = _pick(parsed, 'chatId', 'groupId') or _pick(nested, 'chatId', 'groupId')
                group_id = _pick(parsed, 'groupId') or _pick(nested, 'groupId') or chat_id
                post_id = _pick(parsed, 'postId', 'id') or _pick(nested, 'postId', 'id')
                sent_at = _pick(parsed, 'sentAt', 'creationTime') or _pick(nested, 'sentAt', 'creationTime')
                error = _pick(parsed, 'error', 'message', 'detail') or _pick(nested, 'error', 'message', 'detail')
                status_text = _pick(parsed, 'status') or ('succeeded' if str(status_code).startswith('2') and not error else 'failed')
                accepted = 'true' if str(status_code).startswith('2') and not error else 'false'

                return {
                    'accepted': accepted,
                    'channel': _trim(channel),
                    'status': status_text if accepted == 'true' else 'failed',
                    'chatId': chat_id,
                    'groupId': group_id,
                    'postId': post_id,
                    'sentAt': sent_at,
                    'error': error if accepted == 'false' else '',
                    'statusCode': _trim(status_code) or '0',
                    'rawBody': raw[:8000],
                }

