      - id: '1785473000002'
        type: custom
        width: 260
        height: 120
        position:
          x: 380
          y: 190
        positionAbsolute:
          x: 380
          y: 190
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          type: code
          title: Normalize Botman Request
          desc: 归一 mode，拼装 /user/message 或 /team/message body 与 URL
          selected: false
          code_language: python3
          variables:
            - variable: mode
              value_selector:
                - '1785473000001'
                - mode
            - variable: message
              value_selector:
                - '1785473000001'
                - message
            - variable: email
              value_selector:
                - '1785473000001'
                - email
            - variable: personName
              value_selector:
                - '1785473000001'
                - personName
            - variable: teamId
              value_selector:
                - '1785473000001'
                - teamId
            - variable: mention
              value_selector:
                - '1785473000001'
                - mention
            - variable: mentionAutoCorrect
              value_selector:
                - '1785473000001'
                - mentionAutoCorrect
            - variable: skipMentionCheck
              value_selector:
                - '1785473000001'
                - skipMentionCheck
            - variable: isTeamMention
              value_selector:
                - '1785473000001'
                - isTeamMention
            - variable: mentionList_json
              value_selector:
                - '1785473000001'
                - mentionList_json
            - variable: payload_json
              value_selector:
                - '1785473000001'
                - payload_json
          outputs:
            request_path:
              type: string
              children: null
            request_body:
              type: string
              children: null
            channel:
              type: string
              children: null
            ok:
              type: string
              children: null
            error:
              type: string
              children: null
          code: |
            import json

            def _trim(value):
                if value is None:
                    return ''
                return str(value).strip()

            def _parse_bool(raw, default=False):
                text = _trim(raw).lower()
                if not text:
                    return default
                if text in ('1', 'true', 'yes', 'y', 'on'):
                    return True
                if text in ('0', 'false', 'no', 'n', 'off'):
                    return False
                return default

            def _parse_json(raw, field_name, default=None):
                text = _trim(raw)
                if not text:
                    return default
                try:
                    return json.loads(text)
                except Exception as exc:
                    raise ValueError(f'{field_name} is not valid JSON: {exc}') from exc

            def _normalize_mode(raw):
                text = _trim(raw).lower()
                if text in ('user', 'private', 'dm', 'person'):
                    return 'user'
                if text in ('team', 'group'):
                    return 'team'
                raise ValueError('mode must be user/private or team/group')

            def main(
                mode: str = '',
                message: str = '',
                email: str = '',
                personName: str = '',
                teamId: str = '',
                mention: str = '',
                mentionAutoCorrect: str = '',
                skipMentionCheck: str = '',
                isTeamMention: str = '',
                mentionList_json: str = '',
                payload_json: str = '',
            ) -> dict:
                try:
                    channel = _normalize_mode(mode)
                    payload = _parse_json(payload_json, 'payload_json', None)
                    body = dict(payload) if isinstance(payload, dict) else {}

                    if channel == 'user':
                        if _trim(message):
                            body['message'] = message
                        if _trim(email):
                            body['email'] = _trim(email)
                        if _trim(personName):
                            body['personName'] = _trim(personName)
                        if _trim(mention):
                            body['mention'] = _parse_bool(mention, True)
                        elif 'mention' not in body:
                            body['mention'] = True
                        if _trim(mentionAutoCorrect):
                            body['mentionAutoCorrect'] = _parse_bool(mentionAutoCorrect, True)
                        elif 'mentionAutoCorrect' not in body:
                            body['mentionAutoCorrect'] = True
                        if not _trim(body.get('message')):
                            raise ValueError('message is required for user/private mode')
                        if not (_trim(body.get('email')) or _trim(body.get('personName'))):
                            raise ValueError('email or personName is required for user/private mode')
                        request_path = 'user/message'
                    else:
                        if _trim(message):
                            body['message'] = message
                        if _trim(teamId):
                            body['teamId'] = _trim(teamId)
                        mention_list = _parse_json(mentionList_json, 'mentionList_json', None)
                        if mention_list is not None:
                            body['mentionList'] = mention_list
                        elif 'mentionList' not in body:
                            body['mentionList'] = []
                        if _trim(isTeamMention):
                            body['isTeamMention'] = _parse_bool(isTeamMention, False)
                        elif 'isTeamMention' not in body:
                            body['isTeamMention'] = False
                        if _trim(skipMentionCheck):
                            body['skipMentionCheck'] = _parse_bool(skipMentionCheck, True)
                        elif 'skipMentionCheck' not in body:
                            body['skipMentionCheck'] = True
                        if not _trim(body.get('message')):
                            raise ValueError('message is required for team/group mode')
                        if not _trim(body.get('teamId')):
                            raise ValueError('teamId is required for team/group mode')
                        request_path = 'team/message'

                    return {
                        'request_path': request_path,
                        'request_body': json.dumps(body, ensure_ascii=False),
                        'channel': channel,
                        'ok': 'true',
                        'error': '',
                    }
                except Exception as exc:
                    return {
                        'request_path': '',
                        'request_body': '{}',
                        'channel': _trim(mode) or 'unknown',
                        'ok': 'false',
                        'error': str(exc),
                    }

