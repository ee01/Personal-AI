# Personal AI · Botman Dify 跳板
# 用途：Jira Automation 不能直连 botman 时，经 Dify HTTP 转发到
#   POST {BOT_API_BASE_URL}/user/message  （私发）
#   POST {BOT_API_BASE_URL}/team/message  （群发）
#
# 导入后请检查：
# 1. 环境变量 BOT_API_BASE_URL（默认 https://botman.int.rclabenv.com/v2）
# 2. 环境变量 BOT_TOKEN（Bearer）
# 3. 环境变量 BOT_ID（请求头 bot）
# 4. 发布 Workflow，复制 API URL + API Key，回头给我替换 Jira rule 里的
#    {{BOT_API_BASE_URL}}/user/message 与 /team/message 两段 webhook
#
# HTTP 实际打：{{BOT_API_BASE_URL}}/{{request_path}}
#   user/private → user/message
#   team/group   → team/message
#
# Jira / 调用方期望体（response_mode=blocking）：
#
# 私发：
# {
#   "inputs": {
#     "mode": "user",
#     "message": "正文",
#     "email": "esone.qiu@ringcentral.com",
#     "mention": "true",
#     "mentionAutoCorrect": "true"
#   },
#   "response_mode": "blocking",
#   "user": "esone.qiu"
# }
#
# 群发：
# {
#   "inputs": {
#     "mode": "team",
#     "message": "正文",
#     "teamId": "148192141318",
#     "skipMentionCheck": "true",
#     "isTeamMention": "false",
#     "mentionList_json": "[]"
#   },
#   "response_mode": "blocking",
#   "user": "esone.qiu"
# }
#
# 也可用 payload_json 直接传完整 botman body；mode 仍决定打哪个 endpoint。
# 成功输出对齐现有 Jira mark 路径：data.outputs.chatId / postId / sentAt（及 id / creationTime 别名）。

app:
  description: Jira Automation → Dify → botman /user/message 与 /team/message 跳板。只转发，不改写正文。
  icon: 🤖
  icon_background: '#EEF6FF'
  mode: workflow
  name: Personal AI Botman Jumpboard
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.1.0
workflow:
  conversation_variables: []
  environment_variables:
    - id: env-bot-api-base-url
      name: BOT_API_BASE_URL
      value: https://botman.int.rclabenv.com/v2
      value_type: string
      description: botman API 根路径，不含尾斜杠
    - id: env-bot-token
      name: BOT_TOKEN
      value: ''
      value_type: secret
      description: botman Bearer token；导入后在 Dify 环境变量中填写
    - id: env-bot-id
      name: BOT_ID
      value: 4700372020@37439510.bot.glip.net
      value_type: string
      description: 请求头 bot 的值（SM AI bot id）
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    viewport:
      x: 0
      y: 0
      zoom: 0.7
    edges:
      - id: start-to-normalize
        source: '1785473000001'
        sourceHandle: source
        target: '1785473000002'
        targetHandle: target
        type: custom
        data:
          sourceType: start
          targetType: code
          isInIteration: false
          isInLoop: false
        zIndex: 0
      - id: normalize-to-http
        source: '1785473000002'
        sourceHandle: source
        target: '1785473000003'
        targetHandle: target
        type: custom
        data:
          sourceType: code
          targetType: http-request
          isInIteration: false
          isInLoop: false
        zIndex: 0
      - id: http-to-parse
        source: '1785473000003'
        sourceHandle: source
        target: '1785473000004'
        targetHandle: target
        type: custom
        data:
          sourceType: http-request
          targetType: code
          isInIteration: false
          isInLoop: false
        zIndex: 0
      - id: parse-to-end
        source: '1785473000004'
        sourceHandle: source
        target: '1785473000005'
        targetHandle: target
        type: custom
        data:
          sourceType: code
          targetType: end
          isInIteration: false
          isInLoop: false
        zIndex: 0
