          \      if (object[key] !== undefined && object[key] !== null && String(object[key]).trim()\
          \ !== '') {\n        return String(object[key]);\n      }\n    }\n   \
          \ return '';\n  }\n  const json = parse(body);\n  const candidates = [json,\
          \ json.data, json.outputs, json.result, json.post, json.message].filter(Boolean);\n\
          \  const result = { chatId: '', postId: '', sentAt: '' };\n  for (const\
          \ item of candidates) {\n    if (!result.chatId) result.chatId = pick(item,\
          \ ['chatId', 'groupId', 'chat_id', 'group_id', 'resolved_chat_id']);\n\
          \    if (!result.postId) result.postId = pick(item, ['postId', 'post_id',\
          \ 'id']);\n    if (!result.sentAt) result.sentAt = pick(item, ['sentAt',\
