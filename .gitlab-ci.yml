stages:
  - build
  - release

build:
  stage: build
  image: node:16
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - /^v.*/   # 只有以v开头的标签才会触发

create_release_assets:
  stage: release
  image: alpine:latest
  script:
    - apk add --no-cache zip
    - cd dist
    - zip -r ../dist-${CI_COMMIT_TAG}.zip .
    - cd ..
  artifacts:
    paths:
      - dist-${CI_COMMIT_TAG}.zip
    expire_in: 1 week
  only:
    - /^v.*/   # 只有以v开头的标签才会触发
  needs:
    - job: build
      artifacts: true

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "创建发布包..."
    - |
      release-cli create --name "Release $CI_COMMIT_TAG" \
        --tag-name $CI_COMMIT_TAG \
        --description "版本 $CI_COMMIT_TAG 发布" \
        --assets-link "{\"name\":\"dist-$CI_COMMIT_TAG.zip\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist-${CI_COMMIT_TAG}.zip?job=create_release_assets\"}"
  needs:
    - job: create_release_assets
      artifacts: true
  only:
    - /^v.*/   # 只有以v开头的标签才会触发