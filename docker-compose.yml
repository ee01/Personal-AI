version: '3.8'

services:
  memory-service:
    build: ./memory-service
    container_name: memory-service
    ports:
      - "3210:3210"
    volumes:
      - ./memory-service/data:/app/data
    env_file:
      - ./memory-service/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3210/health"]
      interval: 30s
      timeout: 10s
      retries: 3
