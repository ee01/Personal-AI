services:
  memory-service:
    build: ./memory-service
    container_name: memory-service
    ports:
      - "3210:3210"
    volumes:
      - ./memory-service/data:/app/data
    env_file:
      - ./memory-service/.env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3210/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
