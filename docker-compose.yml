services:
  memory-service:
    build:
      context: ./memory-service
      extra_hosts:
        - "registry.npmjs.org:104.16.29.34"
    container_name: memory-service
    ports:
      - "3210:3210"
    volumes:
      # The deploy host is Docker Desktop on macOS, where a bind mount is served
      # by virtiofs. SQLite's advisory locks and fsync ordering are not reliable
      # there, which is what kept corrupting chunks_fts. Setting
      # MEMORY_DATA_MOUNT=memory-data switches to the named volume declared
      # below, which lives in the Linux VM's own ext4 filesystem.
      #
      # The default stays on the bind mount on purpose: deploys sync this file
      # but never the data, so flipping it here would start the service against
      # an empty volume. Run tools/migrate-memory-data-volume.sh to copy the data
      # and set the variable in the same maintenance window. npm run deploy:memory
      # restores MEMORY_DATA_MOUNT=memory-data when that named volume already
      # exists, so a lost host .env line cannot silently fall back to virtiofs.
      - ${MEMORY_DATA_MOUNT:-./memory-service/data}:/app/data
    env_file:
      - ./memory-service/.env
    restart: unless-stopped
    # SQLite needs to finish its current write and unlink the journal. The 10s
    # default SIGKILL can land mid-transaction.
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3210/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  roadmap-service:
    build:
      context: ./roadmap-service
      extra_hosts:
        - "registry.npmjs.org:104.16.29.34"
    container_name: roadmap-service
    ports:
      - "3220:3220"
    volumes:
      - ./roadmap-service/data:/app/data
    env_file:
      - ./roadmap-service/.env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3220/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  memory-data:
