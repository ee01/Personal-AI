  - id: source-memory-distiller
    title: Source Memory Distiller Experience Eval
    description: 验证资料保存后的同步 P0 与异步深度蒸馏是否保持证据引用、隐私/注入门控、场景相关召回、来源聚类和零高责任自动写入。
    enabled: true
    workflow: evals/workflows/source-memory-distiller/experience.md
    cases: evals/cases/source-memory-distiller/cases.jsonl
    runMode: scheduled
    schedule:
      enabled: true
      cron: "15 10 * * 2"
      every: 7d
      timezone: Asia/Shanghai
      action: report
      repair: suggest
    readerProof:
      claims:
        - id: grounded-artifacts-cite-current-source-spans
          statement: >-
            视觉表格会先形成确定性 evidence spans；无效 span 引用会被丢弃，deep 产物不会借机写画像或创建动作。
          caseIds:
            - visual-table-rows-become-grounded-spans
          requiredScores:
            groundingIntegrity: 3
            lifecycleFallback: 3
            sideEffectBoundary: 3
        - id: unsafe-sources-keep-p0-and-block-deep-model
          statement: >-
            含 prompt injection 的资料会在模型调用前阻断 deep，同时保留同步 P0 作为可复核兜底。
          caseIds:
            - prompt-injection-blocks-deep-model
          requiredScores:
            groundingIntegrity: 3
            lifecycleFallback: 3
            sideEffectBoundary: 3
        - id: related-sources-cluster-without-merging-originals
          statement: >-
            指向同一 Jira key 的独立资料会形成来源簇和派生关联，但不会合并、删除或改写各自 capsule 与原始证据。
          caseIds:
            - duplicate-jira-sources-stay-independent
          requiredScores:
            groundingIntegrity: 3
            sourceAggregation: 3
            sideEffectBoundary: 3
        - id: external-ai-workflow-remains-an-unpublished-seed
          statement: >-
            单条外部 AI 对话只能产生 evidence-grounded Skill seed，不会确认画像、创建动作、激活 Skill 或发送通知。
          caseIds:
            - external-ai-skill-remains-a-seed
          requiredScores:
            groundingIntegrity: 3
            sideEffectBoundary: 3
        - id: deep-only-trigger-respects-scene-boundary
          statement: >-
            deep-only 关键词只会在 trigger card 匹配的 Ask 场景召回，不会在不匹配的会议场景绕过门控。
          caseIds:
            - deep-trigger-only-recalls-in-matching-scene
          requiredScores:
            groundingIntegrity: 3
            sceneRelevance: 3
            sideEffectBoundary: 3
      boundaries:
        - 本 suite 向生产 worker 注入受控 JSON，用于确定性验证证据、生命周期和副作用门控；不证明线上模型对所有真实资料都能生成最佳摘要或候选。
        - 本报告不替代 heartbeat 长时间运行、真实 esone.qiu 数据或 Source Memory 详情页交互证明；这些分别由 worker 测试、memory-abilities gate 和 Playwright E2E 验证。
        - 本 suite 断言没有画像、动作或 Skill 激活写入，但不会调用任何真实外部发送、Slides、Docs、Jira 或消息写回 API。
    judge:
      heuristic: true
      llm: false
      rubric: evals/judges/source-memory-distiller.md
    repair:
      mode: suggest
      agent: codex
      allowedPaths:
        - memory-service/src/core/SourceMemoryCaptureService.ts
        - memory-service/src/core/SourceMemoryDistillationWorker.ts
