  - id: ask-conversation-continuity
    title: Ask Conversation Continuity Eval
    description: 评估 Quick Ask 本机续聊线索能否自然延续真实话题、强制重新检索证据、返回清晰回执，并在新问题中保持上下文隔离。
    enabled: true
    workflow: evals/workflows/ask-conversation-continuity/experience.md
    cases: evals/cases/ask-conversation-continuity/cases.jsonl
    runMode: manual
    readerProof:
      claims:
        - id: resume-hint-reretrieves-ai-vbg
          statement: >-
            当 Quick Ask 已把本机续聊线索随“先找谁确认”请求发送给真实 /api/v1/ask 时，服务会锁定 AI VBG / MTR-141852，返回“仅作提示且已重新检索”的回执，并提供本轮 evidence。
          caseIds:
            - ask-continuity-resume-ai-vbg-owner
          requiredScores:
            continuity_contract: 3
            evidence_refresh: 3
            topic_selection: 3
            answer_quality: 3
        - id: near-expiry-hint-never-becomes-authority
          statement: >-
            23 小时旧续聊线索仍只用于定位 AI VBG；系统不会把旧摘要当成当前事实，而会重新检索并以新 evidence 回答。
          caseIds:
            - ask-continuity-near-expiry-reretrieval
          requiredScores:
            continuity_contract: 3
            evidence_refresh: 3
            topic_alignment: 3
            topic_selection: 3
        - id: new-question-isolates-previous-topic
          statement: >-
            不携带 contextHints 的“新问题”请求不会返回续聊回执，也不会泄漏上一轮 AI VBG / MTR-141852 话题，能够独立回答 Nova Brandy Daily。
          caseIds:
            - ask-continuity-new-question-isolation
          requiredScores:
            continuity_contract: 3
            topic_alignment: 3
            context_isolation: 3
            answer_quality: 3
      boundaries:
        - 本报告验证的是请求进入真实 /api/v1/ask 后的续接、重新检索与隔离行为；不证明 Quick Ask 本机快照的保存、展示、“继续”“新问题”和“清除”按钮交互，这些需要另行运行 verify:quick-ask:e2e 验证。
        - 本报告只覆盖 0.08 小时和 23 小时线索；不证明超过 24 小时 TTL 后客户端一定自动清除快照。
        - 本报告只覆盖 AI VBG 与 Nova Brandy Daily 三个真实查询场景，不代表所有话题、代词和数据分布。
    endpoint:
      url: http://10.32.56.212:3210/api/v1/ask
      userId: esone.qiu
    judge:
      heuristic: true
      llm: false
      rubric: evals/judges/ask-conversation-continuity.md
    repair:
      mode: suggest
      agent: codex
      allowedPaths:
        - desktop-app/app/quick-ask-resume.js
        - desktop-app/app/quick-ask.js
        - desktop-app/src/memoryServiceClient.ts
        - desktop-app/src/server.ts
        - memory-service/src/routes/ask.ts
        - memory-service/src/__tests__/api-ask.test.ts
        - tools/eval-run.mjs
        - evals/**
        - docs/features/**
        - desktop-app/docs/features/**
      validate:
        - npm run verify:quick-ask:e2e
        - npm --prefix memory-service test -- --run src/__tests__/api-ask.test.ts
        - npm run eval:run -- --suite ask-conversation-continuity --no-repair

