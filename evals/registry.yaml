version: 1
defaults:
  agent: codex
  resultRoot: .eval-runs
  repair:
    mode: suggest
    landing: current_worktree
    requireCleanWorktree: true

scheduler:
  enabled: true
  pollInterval: 30m
  stateFile: .eval-runs/scheduler-state.json
  latestReport: .eval-runs/latest-report.html
  defaultAction: report
  timezone: Asia/Shanghai

suites:
  - id: context-recall
    title: Context Recall Experience Eval
    description: 评估统一 /context-recall 在真实网页或会话上下文中召回的记忆是否真正相关，是否适合展示给 Memory Lens、Meeting Pilot 等上游场景。
    enabled: true
    workflow: evals/workflows/context-recall/experience.md
    cases: evals/cases/context-recall/real-ringcentral-groups.jsonl
    runMode: scheduled
    schedule:
      enabled: true
      cron: "0 9 * * 1"
      every: 7d
      timezone: Asia/Shanghai
      action: report
      repair: auto
    caseSchedules:
      - caseId: rc-coach-codex-token
        every: 7d
        action: report
      - caseId: rc-bug-ai-repair
        every: 7d
        action: report
      - caseId: rc-colin-michael-codex-quality
        every: 7d
        action: report
      - caseId: rc-webinar-cn-xmn-up
        every: 7d
        action: report
    endpoint:
      url: http://10.32.56.212:3210/api/v1/context-recall
      userId: esone.qiu
    judge:
      heuristic: true
      llm: true
      rubric: evals/judges/context-recall-relevance.md
    repair:
      mode: suggest
      agent: codex
      allowedPaths:
        - memory-service/src/core/**
        - memory-service/src/routes/**
        - memory-service/src/__tests__/**
        - src/web-intelligence/**
        - src/contentScriptWebIntelligence.ts
        - docs/features/**
      validate:
        - npm --prefix memory-service test -- --run src/__tests__/api-context-recall.test.ts
        - npm run verify:webpage-memory-detection

  - id: scene-memory-autopilot
    title: Scene Memory Autopilot Eval
    description: 验证 /context-recall 展示前过滤层是否能静默弱语义、跨域噪音、低信息会议壳和同源重复，并让强相关 Lens 候选带可解释场景锚点。
    enabled: true
    workflow: evals/workflows/scene-memory-autopilot/experience.md
    cases: evals/cases/scene-memory-autopilot/cases.jsonl
    runMode: manual
    judge:
      heuristic: true
      llm: false
      rubric: evals/judges/context-recall-relevance.md
    repair:
      mode: suggest
      agent: codex
      allowedPaths:
        - memory-service/src/core/ContextRecallService.ts
        - memory-service/src/types/index.ts
        - memory-service/src/__tests__/api-context-recall.test.ts
        - src/services/MemoryServiceClient.ts
        - desktop-app/src/memoryServiceClient.ts
        - tools/eval-scene-memory-autopilot.ts
        - tools/eval-run.mjs
        - evals/**
        - docs/features/**
      validate:
        - npm --prefix memory-service test -- --run src/__tests__/api-context-recall.test.ts
        - npm run eval:run -- --suite scene-memory-autopilot --no-repair

