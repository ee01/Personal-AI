        - 本 suite 不调用 Calendar、Jira、RingCentral、消息或任务写入 API；外部无写回边界需结合路由审查和页面回执理解。
    judge:
      heuristic: true
      llm: false
      rubric: evals/judges/meeting-outcome-binder.md
    repair:
      mode: suggest
      agent: codex
      allowedPaths:
