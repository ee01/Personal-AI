  - id: meeting-outcome-binder
    title: Meeting Outcome Binder Experience Eval
    description: 验证 Today Pilot 会前目标能否在 Meeting Pilot 会后只按匹配证据装订为闭环、部分闭环、未闭环或带到后续，并被 Ask 只读引用。
    enabled: true
    workflow: evals/workflows/meeting-outcome-binder/experience.md
    cases: evals/cases/meeting-outcome-binder/cases.jsonl
    runMode: scheduled
    schedule:
      enabled: true
      cron: "30 9 * * 1"
      every: 7d
      timezone: Asia/Shanghai
      action: report
      repair: suggest
    readerProof:
      claims:
        - id: mixed-meeting-results-follow-evidence-strength
          statement: >-
            Q3 planning 的决议会闭环，pending capacity 行动项只会部分闭环，只有明确“下次继续”的 transcript 才会带到后续；三种结果可被 Ask 只读引用。
          caseIds:
            - q3-planning-mixed-outcomes
          requiredScores:
            preview_contract: 3
            status_guard: 3
            evidence_grounding: 3
            persistence: 3
            ask_read_boundary: 3
        - id: transcript-mention-never-closes-an-outcome
          statement: >-
            Transcript 只有提及时，即使模型返回 resolved，生产证据守卫也会降级为 unresolved，并且不会把模型的“已解决”摘要提供给 Ask。
          caseIds:
            - transcript-mention-cannot-resolve
          requiredScores:
            status_guard: 3
            evidence_grounding: 3
            ask_read_boundary: 3
        - id: invalid-citations-fail-closed
          statement: >-
            模型引用不存在的 evidence ref 时，结果会进入 blocked_by_missing_evidence，不会产生或持久化虚假的预算 owner 结论。
          caseIds:
            - invalid-evidence-reference-blocks-closure
          requiredScores:
            status_guard: 3
            evidence_grounding: 3
            persistence: 3
        - id: completed-action-can-close-an-outcome
          statement: >-
            与目标匹配且状态为 done 的行动项可以把结果标记为 resolved，并保留 action 证据供会后页和 Ask 使用。
          caseIds:
            - completed-action-resolves-outcome
          requiredScores:
            status_guard: 3
            evidence_grounding: 3
            persistence: 3
      boundaries:
        - 本报告验证生产 MeetingOutcomeBinderService 的证据守卫、持久化与 Ask 格式化；不证明真实 LLM 对所有议程都能生成最佳目标。
