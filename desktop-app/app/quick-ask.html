<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal AI Quick Ask</title>
    <link rel="stylesheet" href="./quick-ask.css" />
  </head>
  <body>
    <div id="quick-ask-shell" class="quick-ask-shell" data-state="idle-compact">
      <div id="quick-ask-frame" class="quick-ask-frame">
        <div class="quick-ask-drag-strip" aria-hidden="true"></div>
        <section
          id="conversation-panel"
          class="conversation-panel"
          aria-live="polite"
        ></section>

        <section id="voice-sheet" class="voice-sheet">
          <div
            id="voice-transcript"
            class="voice-transcript"
            data-i18n="desktop.quickAsk.voicePrompt"
          >
            按住 Option+A 或点击麦克风开始说话
          </div>
          <button
            id="voice-recovery"
            class="voice-recovery"
            type="button"
            hidden
          ></button>
          <div class="voice-strip">
            <button
              id="voice-cancel"
              class="voice-action voice-cancel"
              type="button"
              aria-label="返回文本输入"
              data-i18n-aria-label="desktop.quickAsk.cancelVoice"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M6.7 6.7a1 1 0 0 1 1.4 0L12 10.6l3.9-3.9a1 1 0 1 1 1.4 1.4L13.4 12l3.9 3.9a1 1 0 0 1-1.4 1.4L12 13.4l-3.9 3.9a1 1 0 1 1-1.4-1.4l3.9-3.9-3.9-3.9a1 1 0 0 1 0-1.4Z"
                ></path>
              </svg>
            </button>

            <div class="voice-orb-wrap">
              <div class="voice-rings">
                <span class="voice-ring ring-a"></span>
                <span class="voice-ring ring-b"></span>
                <span class="voice-ring ring-c"></span>
              </div>
              <button
                id="voice-orb"
                class="voice-orb"
                type="button"
                aria-label="开始或停止语音输入"
                data-i18n-aria-label="desktop.quickAsk.toggleVoice"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M12 15.8a3.8 3.8 0 0 0 3.8-3.8V7.8a3.8 3.8 0 1 0-7.6 0V12a3.8 3.8 0 0 0 3.8 3.8Z"
                  ></path>
                  <path
                    d="M18.2 11.4a.9.9 0 0 0-1.8 0 4.4 4.4 0 1 1-8.8 0 .9.9 0 0 0-1.8 0 6.2 6.2 0 0 0 5.3 6.1v2.1H9.3a.9.9 0 0 0 0 1.8h5.4a.9.9 0 0 0 0-1.8h-1.8v-2.1a6.2 6.2 0 0 0 5.3-6.1Z"
                  ></path>
                </svg>
              </button>
            </div>

            <button
              id="voice-send"
              class="voice-action voice-send"
              type="button"
              aria-label="发送语音内容"
              data-i18n-aria-label="desktop.quickAsk.sendVoice"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h12"></path>
                <path d="M12 5l7 7-7 7"></path>
              </svg>
            </button>
          </div>
        </section>

        <section id="composer-panel" class="composer-panel">
          <div
            id="pending-hint"
            class="pending-hint"
            data-i18n="desktop.quickAsk.pending"
            hidden
          >
            正在整理答案…
          </div>

          <div class="composer-input-wrap">
            <textarea
              id="composer"
              rows="1"
              maxlength="6000"
              placeholder="问我任何你此刻需要的事…"
              data-i18n-placeholder="desktop.quickAsk.placeholder"
              autocomplete="off"
            ></textarea>
          </div>

          <div
            class="scope-toolbar"
            aria-label="Quick Ask 范围选择"
            data-i18n-aria-label="desktop.quickAsk.toolbarAria"
          >
            <span class="scope-label" data-i18n="desktop.quickAsk.scope"
              >范围</span
            >
            <div
              class="scope-selector"
              role="group"
              aria-label="选择记忆范围"
              data-i18n-aria-label="desktop.quickAsk.scopeAria"
            >
              <button
                id="scope-work-button"
                class="scope-button"
                type="button"
                data-scope="work"
              >
                <span data-i18n="common.work">工作</span>
              </button>
              <button
                id="scope-personal-button"
                class="scope-button"
                type="button"
                data-scope="personal"
              >
                <span data-i18n="common.personal">个人</span>
              </button>
              <button
                id="scope-both-button"
                class="scope-button"
                type="button"
                data-scope="both"
              >
                <span data-i18n="common.both">两者</span>
              </button>
            </div>
          </div>

          <div class="composer-footer">
            <div class="footer-left">
              <button
                id="utility-button"
                class="circle-button utility-button"
                type="button"
                aria-label="打开设置"
                data-i18n-aria-label="desktop.quickAsk.openSettings"
              >
                <span>+</span>
              </button>
              <button
                id="status-pill"
                class="status-pill"
                type="button"
                hidden
              ></button>
            </div>
            <div class="footer-right">
              <button
                id="voice-button"
                class="icon-button voice-button"
                type="button"
                aria-label="语音输入"
                data-i18n-aria-label="desktop.quickAsk.voiceInput"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="9" width="2" height="6" rx="1"></rect>
                  <rect x="7" y="5" width="2" height="14" rx="1"></rect>
                  <rect x="11" y="2" width="2" height="20" rx="1"></rect>
                  <rect x="15" y="6" width="2" height="12" rx="1"></rect>
                  <rect x="19" y="9" width="2" height="6" rx="1"></rect>
                </svg>
              </button>
            </div>
          </div>

          <div id="shortcut-banner" class="shortcut-banner" hidden></div>
        </section>
      </div>
    </div>

    <script type="module" src="./quick-ask.js"></script>
  </body>
</html>
