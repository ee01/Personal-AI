<!DOCTYPE html>
<html>
<head>
  <title>Radar Poc</title>
  <style>
    html, body {
      margin: 0;
      padding: 10px;
      width: 280px;
      border-radius: 4px;
      background-color: #eee;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }
    #container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 20px;
      z-index: 1;
    }
    #fetchDataButton, #clearButton {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 15px 32px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      margin: 10px 0;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s;
    }
    #fetchDataButton:hover, #clearButton:hover {
      background-color: #45a049;
    }
    input[type="number"], input[type="checkbox"] {
      width: calc(100% - 20px);
      padding: 10px;
      margin: 10px 0;
      box-sizing: border-box;
      border: 2px solid #ccc;
      border-radius: 4px;
    }
    label {
      display: block;
      margin: 10px 0;
      font-weight: bold;
    }
    #loading {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      font-size: 24px;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #result {
      margin-top: 20px;
      font-size: 14px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div id="container">
    <label for="recentDays">Data from how many days ago, default is 1 day</label>
    <input id="recentDays" type="number" value="1" />
    <label for="groupPost">
      <input id="groupPost" type="checkbox" checked> Whether to group posts together, default is group
    </label>
    <button id="fetchDataButton">Generate Report</button>
    <div id="result"></div>
  </div>
  <script src="./popup.js"></script>
</body>
</html>
