<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA 测试页面</title>
    <link rel="manifest" href="pwa-manifest.json">
    <meta name="theme-color" content="#60a5fa">
    <style>
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            text-align: center;
            color: #60a5fa;
            margin-bottom: 30px;
        }
        
        .test-section {
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border-left: 4px solid #60a5fa;
        }
        
        .test-section h2 {
            margin-top: 0;
            color: #a78bfa;
        }
        
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-weight: bold;
        }
        
        .status.success {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }
        
        .status.error {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
        
        .status.warning {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }
        
        button {
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin: 5px;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .log {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 10px;
            margin: 10px 0;
        }
        
        .info-label {
            font-weight: bold;
            color: #a78bfa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 PWA 功能测试</h1>
        
        <div class="test-section">
            <h2>📋 系统信息</h2>
            <div class="info-grid">
                <div class="info-label">当前协议:</div>
                <div id="protocol">-</div>
                <div class="info-label">当前域名:</div>
                <div id="hostname">-</div>
                <div class="info-label">Service Worker:</div>
                <div id="sw-support">-</div>
                <div class="info-label">PWA Manifest:</div>
                <div id="manifest-status">-</div>
            </div>
        </div>
        
        <div class="test-section">
            <h2>🔧 Service Worker 状态</h2>
            <div id="sw-status" class="status warning">检查中...</div>
            <button onclick="registerSW()">注册 Service Worker</button>
            <button onclick="checkSWStatus()">检查状态</button>
        </div>
        
        <div class="test-section">
            <h2>📱 PWA 安装状态</h2>
            <div id="install-status" class="status warning">检查中...</div>
            <button onclick="testInstallPrompt()">测试安装提示</button>
            <button onclick="forceShowBanner()">强制显示横幅</button>
            <button onclick="resetPWAState()">重置PWA状态</button>
        </div>
        
        <div class="test-section">
            <h2>📄 Manifest 验证</h2>
            <div id="manifest-validation" class="status warning">检查中...</div>
            <button onclick="validateManifest()">验证 Manifest</button>
        </div>
        
        <div class="test-section">
            <h2>🔍 调试日志</h2>
            <div id="debug-log" class="log">等待操作...</div>
            <button onclick="clearLog()">清空日志</button>
        </div>
    </div>

    <script>
        let deferredPrompt;
        let installBanner;
        
        // 日志函数
        function log(message, type = 'info') {
            const logDiv = document.getElementById('debug-log');
            const time = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#f87171' : type === 'success' ? '#4ade80' : '#ffffff';
            logDiv.innerHTML += `<div style="color: ${color}">[${time}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }
        
        function clearLog() {
            document.getElementById('debug-log').innerHTML = '';
        }
        
        // 更新状态显示
        function updateStatus(elementId, message, type = 'warning') {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `status ${type}`;
        }
        
        // 初始化系统信息
        function initSystemInfo() {
            document.getElementById('protocol').textContent = window.location.protocol;
            document.getElementById('hostname').textContent = window.location.hostname;
            document.getElementById('sw-support').textContent = 'serviceWorker' in navigator ? '✅ 支持' : '❌ 不支持';
            
            // 检查manifest
            const manifestLink = document.querySelector('link[rel="manifest"]');
            document.getElementById('manifest-status').textContent = manifestLink ? '✅ 已链接' : '❌ 未找到';
        }
        
        // 注册 Service Worker
        async function registerSW() {
            if (!('serviceWorker' in navigator)) {
                updateStatus('sw-status', '❌ 浏览器不支持 Service Worker', 'error');
                log('浏览器不支持 Service Worker', 'error');
                return;
            }
            
            try {
                log('开始注册 Service Worker...');
                const registration = await navigator.serviceWorker.register('./sw.js');
                log(`Service Worker 注册成功: ${registration.scope}`, 'success');
                updateStatus('sw-status', '✅ Service Worker 已注册', 'success');
                
                // 监听更新
                registration.addEventListener('updatefound', () => {
                    log('发现 Service Worker 更新');
                });
                
            } catch (error) {
                log(`Service Worker 注册失败: ${error.message}`, 'error');
                updateStatus('sw-status', '❌ Service Worker 注册失败', 'error');
            }
        }
        
        // 检查 Service Worker 状态
        async function checkSWStatus() {
            if (!('serviceWorker' in navigator)) {
                updateStatus('sw-status', '❌ 不支持 Service Worker', 'error');
                return;
            }
            
            try {
                const registration = await navigator.serviceWorker.getRegistration();
                if (registration) {
                    const status = registration.active ? '激活' : registration.installing ? '安装中' : registration.waiting ? '等待' : '未知';
                    updateStatus('sw-status', `✅ Service Worker ${status}`, 'success');
                    log(`Service Worker 状态: ${status}`);
                } else {
                    updateStatus('sw-status', '❌ Service Worker 未注册', 'error');
                    log('Service Worker 未注册');
                }
            } catch (error) {
                log(`检查 Service Worker 状态失败: ${error.message}`, 'error');
            }
        }
        
        // 测试安装提示
        function testInstallPrompt() {
            log('检查 PWA 安装提示状态...');
            
            if (deferredPrompt) {
                log('✅ PWA 安装提示可用', 'success');
                updateStatus('install-status', '✅ 可以安装', 'success');
                
                // 尝试触发安装
                deferredPrompt.prompt().then(() => {
                    return deferredPrompt.userChoice;
                }).then((result) => {
                    log(`用户选择: ${result.outcome}`, result.outcome === 'accepted' ? 'success' : 'info');
                    deferredPrompt = null;
                });
            } else {
                log('❌ PWA 安装提示不可用', 'error');
                updateStatus('install-status', '❌ 不满足安装条件', 'error');
                
                // 检查可能的原因
                const reasons = [];
                if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
                    reasons.push('需要 HTTPS 协议');
                }
                if (!('serviceWorker' in navigator)) {
                    reasons.push('不支持 Service Worker');
                }
                if (!document.querySelector('link[rel="manifest"]')) {
                    reasons.push('缺少 manifest 链接');
                }
                
                if (reasons.length > 0) {
                    log(`可能的原因: ${reasons.join(', ')}`, 'error');
                }
            }
        }
        
        // 验证 Manifest
        async function validateManifest() {
            const manifestLink = document.querySelector('link[rel="manifest"]');
            if (!manifestLink) {
                updateStatus('manifest-validation', '❌ 未找到 manifest 链接', 'error');
                log('未找到 manifest 链接', 'error');
                return;
            }
            
            try {
                log('获取 manifest 文件...');
                const response = await fetch(manifestLink.href);
                const manifest = await response.json();
                
                log('Manifest 验证:');
                log(`- 名称: ${manifest.name || '未设置'}`);
                log(`- 短名称: ${manifest.short_name || '未设置'}`);
                log(`- 启动URL: ${manifest.start_url || '未设置'}`);
                log(`- 显示模式: ${manifest.display || '未设置'}`);
                log(`- 图标数量: ${manifest.icons ? manifest.icons.length : 0}`);
                
                // 验证必需字段
                const required = ['name', 'start_url', 'icons', 'display'];
                const missing = required.filter(field => !manifest[field]);
                
                if (missing.length === 0) {
                    updateStatus('manifest-validation', '✅ Manifest 有效', 'success');
                    log('✅ Manifest 验证通过', 'success');
                } else {
                    updateStatus('manifest-validation', `❌ 缺少字段: ${missing.join(', ')}`, 'error');
                    log(`❌ Manifest 缺少必需字段: ${missing.join(', ')}`, 'error');
                }
                
            } catch (error) {
                updateStatus('manifest-validation', '❌ Manifest 获取失败', 'error');
                log(`Manifest 获取失败: ${error.message}`, 'error');
            }
        }
        
        // 强制显示横幅（如果存在）
        function forceShowBanner() {
            if (window.debugShowInstallBanner) {
                window.debugShowInstallBanner();
                log('强制显示安装横幅');
            } else {
                log('安装横幅功能未加载', 'error');
            }
        }
        
        // 重置 PWA 状态
        function resetPWAState() {
            localStorage.removeItem('pwa-installed');
            localStorage.removeItem('pwa-install-accepted');
            localStorage.removeItem('pwa-install-dismissed');
            deferredPrompt = null;
            
            if (window.debugResetPWAState) {
                window.debugResetPWAState();
            }
            
            log('PWA 状态已重置', 'success');
            updateStatus('install-status', '🔄 已重置，等待检查', 'warning');
        }
        
        // 监听 PWA 安装提示
        window.addEventListener('beforeinstallprompt', (e) => {
            log('🎯 PWA 安装提示触发！', 'success');
            e.preventDefault();
            deferredPrompt = e;
            updateStatus('install-status', '✅ 检测到安装提示', 'success');
        });
        
        // 监听 PWA 安装成功
        window.addEventListener('appinstalled', (e) => {
            log('🎉 PWA 安装成功！', 'success');
            updateStatus('install-status', '🎉 PWA 已安装', 'success');
        });
        
        // 页面加载时初始化
        window.addEventListener('load', () => {
            log('页面加载完成，开始初始化...');
            initSystemInfo();
            
            // 延迟检查状态
            setTimeout(() => {
                checkSWStatus();
                validateManifest();
                testInstallPrompt();
            }, 1000);
        });
    </script>
    
    <!-- 加载 PWA 初始化脚本 -->
    <script src="pwa-init.js"></script>
</body>
</html>
