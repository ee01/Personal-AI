<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal AI 记忆系统 - 启动器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .launcher-container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        h1 {
            color: #60a5fa;
            margin-bottom: 16px;
            font-size: 2rem;
            font-weight: 600;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 30px 0;
        }

        .option-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .option-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .option-card.recommended {
            border-color: #60a5fa;
            background: rgba(96, 165, 250, 0.1);
        }

        .option-title {
            color: #60a5fa;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .option-description {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .btn {
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
            font-size: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .setup-section {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border-left: 4px solid #fbbf24;
        }

        .setup-title {
            color: #fbbf24;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .setup-steps {
            text-align: left;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.6;
        }

        .setup-steps ol {
            padding-left: 20px;
        }

        .setup-steps li {
            margin: 8px 0;
        }

        .url-input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            margin: 10px 0;
        }

        .url-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-weight: 500;
        }

        .status.success {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status.error {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>
    <div class="launcher-container">
        <div class="logo">🧠</div>
        <h1>Personal AI 记忆系统</h1>
        <p class="subtitle">选择您喜欢的访问方式，获得最佳体验</p>

        <div class="options">
            <!-- 选项1: PWA应用 -->
            <div class="option-card recommended" onclick="openPWAApp()">
                <div class="option-title">
                    📱 PWA 应用 (推荐)
                    <span style="background: #60a5fa; color: white; font-size: 0.7rem; padding: 2px 8px; border-radius: 12px;">最佳体验</span>
                </div>
                <div class="option-description">
                    可安装到桌面的独立应用，支持离线使用、推送通知等原生应用功能
                </div>
                <button class="btn">启动 PWA 应用</button>
            </div>

            <!-- 选项2: 扩展内页面 -->
            <div class="option-card" onclick="openExtensionPage()">
                <div class="option-title">
                    🔧 扩展内页面
                </div>
                <div class="option-description">
                    在浏览器扩展环境中运行，功能完整但无法安装为桌面应用
                </div>
                <button class="btn secondary">使用扩展页面</button>
            </div>
        </div>

        <!-- PWA设置区域 -->
        <div class="setup-section">
            <div class="setup-title">
                ⚙️ PWA 应用设置
            </div>
            <div class="setup-steps">
                <p><strong>如果您有自己的服务器，可以部署PWA版本：</strong></p>
                <ol>
                    <li>将 <code>memory.html</code>、<code>pwa-manifest.json</code>、<code>sw.js</code> 等文件部署到HTTPS服务器</li>
                    <li>在下方输入您的PWA应用地址</li>
                    <li>点击"保存设置"完成配置</li>
                </ol>
                
                <input type="url" id="pwaUrl" class="url-input" 
                       placeholder="https://your-domain.com/memory.html"
                       title="PWA应用的HTTPS地址">
                
                <div style="margin: 15px 0;">
                    <button class="btn secondary" onclick="savePWAUrl()">保存设置</button>
                    <button class="btn secondary" onclick="testPWAUrl()">测试连接</button>
                    <button class="btn secondary" onclick="resetPWAUrl()">重置</button>
                </div>
                
                <div id="pwa-status"></div>
            </div>
        </div>
    </div>

    <script>
        // 页面加载时检查已保存的设置
        window.addEventListener('load', () => {
            chrome.storage.sync.get(['pwaMemoryUrl'], (result) => {
                if (result.pwaMemoryUrl) {
                    document.getElementById('pwaUrl').value = result.pwaMemoryUrl;
                    showStatus('已配置 PWA 地址: ' + result.pwaMemoryUrl, 'success');
                }
            });
        });

        // 打开PWA应用
        function openPWAApp() {
            chrome.storage.sync.get(['pwaMemoryUrl'], (result) => {
                const pwaUrl = result.pwaMemoryUrl;
                
                if (pwaUrl && pwaUrl !== 'https://your-domain.com/memory.html') {
                    // 有配置的PWA地址，直接打开
                    chrome.tabs.create({ url: pwaUrl, active: true });
                } else {
                    // 没有配置，显示设置提示
                    showStatus('请先配置 PWA 应用地址，或使用下方的扩展内页面', 'error');
                    document.getElementById('pwaUrl').focus();
                }
            });
        }

        // 打开扩展内页面
        function openExtensionPage() {
            chrome.tabs.create({
                url: chrome.runtime.getURL('memory.html'),
                active: true
            });
        }

        // 保存PWA地址
        function savePWAUrl() {
            const url = document.getElementById('pwaUrl').value.trim();
            
            if (!url) {
                showStatus('请输入 PWA 应用地址', 'error');
                return;
            }

            if (!url.startsWith('https://')) {
                showStatus('PWA 应用必须使用 HTTPS 地址', 'error');
                return;
            }

            chrome.storage.sync.set({ pwaMemoryUrl: url }, () => {
                showStatus('PWA 地址已保存: ' + url, 'success');
            });
        }

        // 测试PWA连接
        async function testPWAUrl() {
            const url = document.getElementById('pwaUrl').value.trim();
            
            if (!url) {
                showStatus('请先输入 PWA 应用地址', 'error');
                return;
            }

            try {
                showStatus('正在测试连接...', 'info');
                const response = await fetch(url, { method: 'HEAD' });
                
                if (response.ok) {
                    showStatus('✅ 连接成功！PWA 应用可访问', 'success');
                } else {
                    showStatus(`❌ 连接失败 (${response.status})`, 'error');
                }
            } catch (error) {
                showStatus('❌ 无法连接到 PWA 应用: ' + error.message, 'error');
            }
        }

        // 重置PWA设置
        function resetPWAUrl() {
            chrome.storage.sync.remove(['pwaMemoryUrl'], () => {
                document.getElementById('pwaUrl').value = '';
                showStatus('PWA 设置已重置', 'success');
            });
        }

        // 显示状态信息
        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('pwa-status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            
            // 3秒后清除状态
            setTimeout(() => {
                statusDiv.textContent = '';
                statusDiv.className = '';
            }, 3000);
        }
    </script>
</body>
</html>
