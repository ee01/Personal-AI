<!DOCTYPE html>
<html>
<head>
  <title>项目分析结果与更新建议</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="slides-analysis.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h2 style="margin: 0; color: #333;">项目分析结果与更新建议</h2>
    </div>
    
    <div id="success-message" class="success-message">
      <div style="font-weight: bold; margin-bottom: 10px;">更新成功</div>
      <div id="success-details">已更新项目信息</div>
    </div>
    
    <div id="summary-info" style="margin-bottom: 20px;">
      <p>加载中...</p>
    </div>
    
    <div id="suggestions-container">
      <!-- 建议内容将由JS动态生成 -->
    </div>
    
    <div id="apply-button-container" class="center">
      <!-- 应用按钮将由JS动态生成 -->
    </div>
    
    <div id="summary-section" class="summary-section">
      <h3 style="margin-top: 0;">项目综合情况</h3>
      <div id="project-statistics" style="margin-bottom: 15px;">
        <!-- 项目统计将由JS动态生成 -->
      </div>
      
      <h4 style="margin-bottom: 10px;">关键发现:</h4>
      <ol id="key-findings" style="margin-top: 0; padding-left: 20px;">
        <!-- 关键发现将由JS动态生成 -->
      </ol>
    </div>
  </div>
  
  <script src="slides-analysis.js"></script>
</body>
</html>
