<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        html {
            width: 328px;
            max-width: 328px;
            overflow-x: hidden;
        }
        body {
            width: 300px;
            max-width: 300px;
            padding: 10px;
            overflow-x: hidden;
        }
        #popup-root {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            box-sizing: border-box;
            overflow-x: hidden;
        }
        .popup-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            width: 100%;
            padding: 8px;
            cursor: pointer;
        }
        .topic-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin: 10px 0;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div id="popup-root"></div>
    <script src="popup.js"></script>
</body>
</html>
