<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目进度仪表盘</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f6fa;
            color: #2c3e50;
            overflow-x: hidden;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0;
        }

        .dashboard-loading {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #ecf0f1;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .dashboard-content {
            min-height: 500px;
        }


    </style>
</head>
<body>
    <div class="dashboard-container">


        <div class="dashboard-content">
            <div class="dashboard-loading" id="loading">
                <div class="loading-spinner"></div>
                <p>正在加载项目数据...</p>
            </div>
            
            <div id="dashboard-root"></div>
            
            <div id="error-container"></div>
        </div>
    </div>

    <script src="enhanced-fishbone-timeline.js"></script>
    <script src="project-dashboard.js"></script>
</body>
</html>
