name: 发布 Release

on:
  push:
    tags:
      - 'v*'  # 只在推送v开头的标签时触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        
      - name: 设置 Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
          
      - name: 安装依赖
        run: npm ci
        
      - name: 构建项目
        run: npm run build
        
      - name: 打包 dist 目录
        run: |
          cd dist
          zip -r ../dist-${{ github.ref_name }}.zip .
          cd ..
          
      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: 版本 ${{ github.ref_name }} 发布
          files: dist-${{ github.ref_name }}.zip