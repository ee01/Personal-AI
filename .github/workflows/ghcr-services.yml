name: Publish service images to GHCR

on:
  push:
    tags:
      - 'memory-service-v*'

jobs:
  memory-service:
    if: startsWith(github.ref_name, 'memory-service-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push memory-service
        run: |
          VER="${GITHUB_REF_NAME#memory-service-v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/personal-ai-memory-service"
          docker build -t "${IMAGE}:${VER}" -t "${IMAGE}:latest" ./memory-service
          docker push "${IMAGE}:${VER}"
          docker push "${IMAGE}:latest"
