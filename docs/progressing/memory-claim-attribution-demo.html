<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>记忆主张归属 · Personal AI 交互 Demo</title>
    <!--
      Demo assumptions / 设计假设：
      1. “记忆主张归属”是嵌入聊天、会议和 Ask 召回链路的基础能力，不新增独立工作台。
      2. 原始消息始终按来源留存；用户纠正的只是派生归属与下游写入权限，不改写原文。
      3. 能确定归属时仅展示一条低打扰回执；只有点选主张后才展开解释和纠正动作。
      4. 当前宿主是中性的网页 AI / 会议界面模拟，不复刻任何真实产品，也不代表真实写入。

      Visual reasoning / 视觉理由：
      - 中性灰白宿主让 Personal AI 的红色只承担“记忆边界”提示，不与主任务争夺注意力。
      - 主张使用句内标记而不是多层卡片，保持“先读内容、需要时再看归属”的阅读顺序。
      - 桌面端详情为右侧窄栏；移动端改为可关闭的底部详情层，390px 下仍保留完整主任务。
    -->
    <style>
      :root {
        --page: #eceef1;
        --panel: #ffffff;
        --ink: #20242a;
        --muted: #68707b;
        --faint: #8a919b;
        --line: #d7dbe0;
        --soft-line: #e9ebee;
        --soft: #f6f7f8;
        --pa: #c62828;
        --pa-dark: #9f1f1f;
        --pa-soft: #fff1f1;
        --user: #175f43;
        --user-soft: #eaf6f0;
        --other: #6a4a18;
        --other-soft: #fff7e7;
        --ai: #315a91;
        --ai-soft: #edf4fc;
        --hypothesis: #6b4c86;
        --hypothesis-soft: #f5effa;
        --verified: #17643f;
        --verified-soft: #e9f7ef;
        --blocked: #6d737c;
        --blocked-soft: #f0f1f3;
        --shadow: 0 20px 60px rgba(29, 35, 44, 0.15);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        overflow-x: hidden;
        background: var(--page);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        font-size: 14px;
      }

      button {
        font: inherit;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid rgba(198, 40, 40, 0.23);
        outline-offset: 2px;
      }

      .demo-shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        overflow-x: hidden;
      }

      .demo-bar {
        position: relative;
        z-index: 20;
        display: grid;
        grid-template-columns: minmax(240px, 1fr) auto minmax(220px, 1fr);
        align-items: center;
        gap: 18px;
        min-height: 72px;
        padding: 11px 20px;
        border-bottom: 1px solid #cfd3d8;
        background: rgba(255, 255, 255, 0.97);
      }

      .demo-brand {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .demo-brand img {
        flex: 0 0 auto;
        width: 36px;
        height: 36px;
        border-radius: 7px;
      }

      .demo-brand strong,
      .demo-brand span {
        display: block;
      }

      .demo-brand strong {
        font-size: 15px;
        line-height: 1.25;
      }

      .demo-brand span {
        margin-top: 3px;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .scene-tabs {
        min-width: 0;
        display: flex;
        gap: 3px;
        padding: 4px;
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f4f5f6;
        scrollbar-width: none;
      }

      .scene-tabs::-webkit-scrollbar {
        display: none;
      }

      .scene-tab {
        min-height: 36px;
        padding: 7px 12px;
        border: 0;
        border-radius: 6px;
        color: #5b626c;
        background: transparent;
        font-weight: 620;
        white-space: nowrap;
      }

      .scene-tab:hover {
        color: var(--ink);
      }

      .scene-tab.active {
        color: var(--ink);
        background: #ffffff;
        box-shadow: 0 1px 5px rgba(29, 35, 44, 0.12);
      }

      .demo-contract {
        min-width: 0;
        text-align: right;
      }

      .demo-contract strong,
      .demo-contract span {
        display: block;
      }

      .demo-contract strong {
        font-size: 13px;
      }

      .demo-contract span {
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      .stage {
        min-width: 0;
        min-height: 0;
        padding: 18px;
      }

      .browser {
        width: min(1280px, 100%);
        height: min(820px, calc(100vh - 108px));
        min-height: 650px;
        margin: 0 auto;
        display: grid;
        grid-template-rows: 42px 1fr;
        overflow: hidden;
        border: 1px solid #c8ccd2;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .browser-chrome {
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr) 76px;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        background: #f1f2f4;
      }

      .traffic {
        display: flex;
        gap: 6px;
      }

      .traffic span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #c6c9ce;
      }

      .traffic span:first-child {
        background: #ed6b60;
      }

      .traffic span:nth-child(2) {
        background: #f2bd50;
      }

      .traffic span:nth-child(3) {
        background: #62c454;
      }

      .address {
        min-width: 0;
        padding: 6px 12px;
        overflow: hidden;
        border: 1px solid #d4d7dc;
        border-radius: 6px;
        background: #fff;
        color: #656c76;
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .host {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: 54px 1fr;
      }

      .host-topbar {
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
        background: #fff;
      }

      .host-brand {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 720;
      }

      .host-mark {
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: 7px;
        color: #fff;
        background: #303640;
        font-size: 11px;
      }

      .host-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .host-state {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
      }

      .active-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--pa);
        box-shadow: 0 0 0 3px var(--pa-soft);
      }

      .host-body {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-columns: 190px minmax(0, 1fr) 310px;
      }

      .host-sidebar {
        min-height: 0;
        padding: 14px 10px;
        overflow: hidden;
        border-right: 1px solid var(--line);
        background: #f7f8f9;
      }

      .new-thread {
        width: 100%;
        min-height: 42px;
        margin-bottom: 18px;
        border: 1px solid #d0d4da;
        border-radius: 7px;
        color: #323840;
        background: #fff;
        font-weight: 650;
      }

      .side-label {
        margin: 0 9px 7px;
        color: #7a818b;
        font-size: 11px;
        font-weight: 760;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .side-item {
        min-height: 40px;
        margin-bottom: 2px;
        padding: 9px;
        overflow: hidden;
        border-radius: 6px;
        color: #555d68;
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .side-item.active {
        color: var(--ink);
        background: #fff;
        box-shadow: inset 3px 0 0 #303640;
        font-weight: 650;
      }

      .thread {
        min-width: 0;
        min-height: 0;
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: #fff;
      }

      .thread-head {
        min-width: 0;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        min-height: 64px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--soft-line);
      }

      .thread-head h1 {
        margin: 0;
        font-size: 16px;
        line-height: 1.35;
      }

      .thread-head p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .privacy-badge {
        flex: 0 0 auto;
        padding: 5px 8px;
        border: 1px solid #d9dce1;
        border-radius: 999px;
        color: #5e6570;
        background: #fafbfc;
        font-size: 11px;
      }

      .thread-scroll {
        min-width: 0;
        min-height: 0;
        padding: 20px 22px 30px;
        overflow: auto;
        overscroll-behavior: contain;
      }

      .message {
        max-width: 760px;
        margin: 0 auto 22px;
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 10px;
      }

      .message.user {
        max-width: 720px;
        margin-left: auto;
      }

      .avatar {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: #fff;
        background: #5b626c;
        font-size: 11px;
        font-weight: 760;
      }

      .message.user .avatar {
        background: #343a42;
      }

      .message-meta {
        display: flex;
        align-items: baseline;
        gap: 7px;
        margin-bottom: 5px;
        color: #353b44;
        font-size: 13px;
        font-weight: 720;
      }

      .message-meta time {
        color: var(--faint);
        font-size: 11px;
        font-weight: 450;
      }

      .message-body {
        color: #343a43;
        font-size: 14px;
        line-height: 1.72;
      }

      .message.user .message-body {
        padding: 12px 14px;
        border-radius: 8px;
        background: #f3f4f5;
      }

      .message-body p {
        margin: 0 0 9px;
      }

      .message-body p:last-child {
        margin-bottom: 0;
      }

      .claim {
        position: relative;
        display: inline;
        min-height: 0;
        margin: 0;
        padding: 1px 3px 2px;
        border: 0;
        border-radius: 4px;
        color: inherit;
        background: var(--blocked-soft);
        box-shadow: inset 0 -2px 0 #aeb3ba;
        line-height: inherit;
        text-align: left;
        -webkit-box-decoration-break: clone;
        box-decoration-break: clone;
      }

      .claim:hover,
      .claim.selected {
        box-shadow: inset 0 -3px 0 currentColor;
      }

      .claim.selected::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -7px;
        width: 5px;
        height: 5px;
        border-right: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
        transform: translateX(-50%) rotate(45deg);
      }

      .claim[data-tone="user"] {
        color: var(--user);
        background: var(--user-soft);
      }

      .claim[data-tone="other"] {
        color: var(--other);
        background: var(--other-soft);
      }

      .claim[data-tone="ai"] {
        color: var(--ai);
        background: var(--ai-soft);
      }

      .claim[data-tone="hypothesis"] {
        color: var(--hypothesis);
        background: var(--hypothesis-soft);
      }

      .claim[data-tone="verified"] {
        color: var(--verified);
        background: var(--verified-soft);
      }

      .claim[data-tone="blocked"] {
        color: var(--blocked);
        background: var(--blocked-soft);
      }

      .claim-key {
        max-width: 760px;
        margin: 0 auto 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        color: var(--muted);
        font-size: 12px;
      }

      .key-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .key-dot {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: currentColor;
      }

      .key-item.user {
        color: var(--user);
      }

      .key-item.other {
        color: var(--other);
      }

      .key-item.ai {
        color: var(--ai);
      }

      .key-item.hypothesis {
        color: var(--hypothesis);
      }

      .key-item.verified {
        color: var(--verified);
      }

      .ask-answer {
        margin: 0 auto 20px;
        max-width: 760px;
        border-left: 3px solid var(--pa);
        padding: 2px 0 2px 16px;
      }

      .ask-answer .answer-label {
        margin-bottom: 7px;
        color: var(--pa);
        font-size: 12px;
        font-weight: 760;
      }

      .ask-answer strong {
        display: block;
        font-size: 19px;
        line-height: 1.45;
      }

      .answer-receipt {
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }

      .evidence-list {
        max-width: 760px;
        margin: 0 auto;
        border-top: 1px solid var(--line);
      }

      .evidence-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 12px 2px;
        border-bottom: 1px solid var(--soft-line);
      }

      .evidence-copy {
        min-width: 0;
      }

      .evidence-copy strong,
      .evidence-copy span {
        display: block;
      }

      .evidence-copy strong {
        font-size: 13px;
      }

      .evidence-copy span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .evidence-status {
        min-width: 112px;
        padding: 5px 8px;
        border-radius: 999px;
        text-align: center;
        font-size: 11px;
        font-weight: 700;
      }

      .evidence-status.used {
        color: var(--user);
        background: var(--user-soft);
      }

      .evidence-status.suppressed {
        color: var(--blocked);
        background: var(--blocked-soft);
      }

      .memory-actionbar {
        position: relative;
        padding: 11px 18px 14px;
        border-top: 1px solid var(--soft-line);
        background: #fafbfc;
      }

      .remember-button {
        width: 100%;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid var(--pa);
        border-radius: 7px;
        color: #fff;
        background: var(--pa);
        font-weight: 730;
      }

      .remember-button:hover {
        background: var(--pa-dark);
      }

      .remember-button img {
        width: 22px;
        height: 22px;
        border-radius: 5px;
      }

      .memory-receipt {
        display: none;
        align-items: flex-start;
        gap: 9px;
        margin-bottom: 9px;
        padding: 9px 10px;
        border: 1px solid #e5bbbb;
        border-radius: 7px;
        color: #5b3434;
        background: #fff7f7;
        font-size: 12px;
        line-height: 1.45;
      }

      .memory-receipt.visible {
        display: flex;
      }

      .receipt-mark {
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: #fff;
        background: var(--pa);
        font-size: 11px;
        font-weight: 800;
      }

      .memory-rail {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: auto 1fr auto;
        border-left: 1px solid var(--line);
        background: #fbfbfc;
      }

      .rail-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        padding: 15px 16px 13px;
        border-bottom: 1px solid var(--line);
      }

      .rail-head h2 {
        margin: 0;
        font-size: 14px;
      }

      .rail-head p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .close-rail {
        display: none;
        width: 36px;
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: #555d67;
        background: #fff;
        font-size: 18px;
      }

      .rail-body {
        min-height: 0;
        padding: 15px 16px 22px;
        overflow: auto;
      }

      .selected-claim {
        margin: 0 0 15px;
        color: #2e343c;
        font-size: 14px;
        font-weight: 680;
        line-height: 1.55;
      }

      .attribution-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 15px;
        padding: 5px 8px;
        border-radius: 999px;
        color: var(--badge-ink, var(--blocked));
        background: var(--badge-bg, var(--blocked-soft));
        font-size: 12px;
        font-weight: 750;
      }

      .attribution-badge::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }

      .detail-list {
        margin: 0;
      }

      .detail-row {
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr);
        gap: 9px;
        padding: 10px 0;
        border-top: 1px solid var(--soft-line);
        font-size: 12px;
        line-height: 1.5;
      }

      .detail-row dt {
        color: var(--muted);
      }

      .detail-row dd {
        margin: 0;
        color: #343a43;
        overflow-wrap: anywhere;
      }

      .write-gate {
        margin-top: 14px;
        padding: 10px 11px;
        border-left: 3px solid var(--gate, #9298a1);
        background: #fff;
        color: #3d434c;
        font-size: 12px;
        line-height: 1.55;
      }

      .write-gate strong {
        display: block;
        margin-bottom: 3px;
        color: var(--gate, #616873);
      }

      .rail-actions {
        padding: 12px 16px 16px;
        border-top: 1px solid var(--line);
        background: #fff;
      }

      .rail-actions-label {
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 11px;
      }

      .correction-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .correction-button {
        min-height: 44px;
        padding: 7px 8px;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: #414852;
        background: #fff;
        font-size: 12px;
        font-weight: 680;
        line-height: 1.35;
      }

      .correction-button:hover {
        border-color: #b8bdc4;
        background: #f7f8f9;
      }

      .correction-button.decision {
        border-color: #d7a4a4;
        color: var(--pa-dark);
      }

      .correction-note {
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }

      .toast {
        position: fixed;
        z-index: 80;
        left: 50%;
        bottom: 26px;
        max-width: min(520px, calc(100vw - 28px));
        padding: 11px 14px;
        border: 1px solid #bebfc3;
        border-radius: 7px;
        color: #fff;
        background: #272c33;
        box-shadow: 0 10px 32px rgba(24, 29, 36, 0.24);
        font-size: 13px;
        line-height: 1.45;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 10px);
        transition: opacity 150ms ease, transform 150ms ease;
      }

      .toast.visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (max-width: 1040px) {
        .demo-bar {
          grid-template-columns: minmax(220px, 1fr) auto;
        }

        .scene-tabs {
          grid-column: 1 / -1;
          grid-row: 2;
          justify-self: center;
        }

        .demo-contract {
          grid-column: 2;
          grid-row: 1;
        }

        .host-body {
          grid-template-columns: minmax(0, 1fr) 300px;
        }

        .host-sidebar {
          display: none;
        }

        .browser {
          height: calc(100vh - 154px);
          min-height: 620px;
        }
      }

      @media (max-width: 720px) {
        body {
          background: #fff;
        }

        .demo-bar {
          grid-template-columns: minmax(0, 1fr);
          gap: 10px;
          padding: 10px 12px;
        }

        .demo-brand {
          grid-column: 1;
          grid-row: 1;
        }

        .demo-brand span,
        .demo-contract {
          display: none;
        }

        .scene-tabs {
          width: 100%;
          grid-column: 1;
          grid-row: 2;
          justify-self: stretch;
        }

        .scene-tab {
          flex: 1 0 auto;
          min-height: 40px;
        }

        .stage {
          padding: 0;
        }

        .browser {
          width: 100%;
          height: calc(100vh - 112px);
          min-height: 640px;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }

        .browser-chrome {

      }

      function findClaim(scene, id) {
        return scene.claims.find((claim) => claim.id === id) || scene.claims[0];
      }

      function renderRail(scene) {
        const claim = findClaim(scene, scene.selected);
        const token = toneTokens[claim.tone] || toneTokens.blocked;
        const railBody = document.getElementById('railBody');
        if (!railBody) return;
        railBody.innerHTML = `
          <p class="selected-claim">“${escapeHtml(claim.text)}”</p>
          <span class="attribution-badge" style="--badge-ink:${token.ink};--badge-bg:${
            token.bg
          }">${escapeHtml(claim.label)}</span>
          <dl class="detail-list">
            <div class="detail-row"><dt>主张所有者</dt><dd>${escapeHtml(
              claim.owner,
            )}</dd></div>
            <div class="detail-row"><dt>表达方式</dt><dd>${escapeHtml(
              claim.mode,
            )}</dd></div>
            <div class="detail-row"><dt>证据来源</dt><dd>${escapeHtml(
              claim.source,
            )}</dd></div>
            <div class="detail-row"><dt>判断把握</dt><dd>${escapeHtml(
              claim.confidence,
            )}</dd></div>
          </dl>
          <div class="write-gate" style="--gate:${
            claim.allowed ? 'var(--user)' : 'var(--pa)'
          }">
            <strong>${escapeHtml(claim.writeTitle)}</strong>
            ${escapeHtml(claim.write)}
          </div>`;
      }

      function refreshClaimNodes(scene) {
        document.querySelectorAll('[data-claim-id]').forEach((node) => {
          const claim = findClaim(scene, node.dataset.claimId);
          node.dataset.tone = claim.tone;
          node.title = `${claim.label}；点击查看写入权限`;
          node.classList.toggle('selected', claim.id === scene.selected);
        });
      }

      function isMobile() {
        return window.matchMedia('(max-width: 720px)').matches;
      }

      function selectClaim(id, openMobile = true) {
        const scene = scenes[activeScene];
        scene.selected = id;
        refreshClaimNodes(scene);
        renderRail(scene);
        if (openMobile && isMobile()) {
          document.getElementById('memoryRail')?.classList.add('mobile-open');
        }
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add('visible');
        toastTimer = window.setTimeout(() => toast.classList.remove('visible'), 3000);
      }

      function applyCorrection(kind) {
        const scene = scenes[activeScene];
        const claim = findClaim(scene, scene.selected);
        if (kind === 'not-mine') {
          claim.label = '已纠正 · 不是我的观点';
          claim.tone = 'other';
          claim.owner = 'other_or_unknown · 用户已纠正';
          claim.mode = 'user-corrected attribution';
          claim.confidence = '确定 · 用户纠正优先于自动判断';
          claim.writeTitle = '阻止进入用户画像与事实';
          claim.write =
            '原文仍在原位置可检索；派生归属已改为“非用户观点”，后续召回不会再把它当作用户立场。';
          claim.allowed = false;
          showToast('已修正归属：不是你的观点。原文未改，后续写入权限已收紧。');
        } else {
          claim.label = '已纠正 · 我的决定';
          claim.tone = 'user';
          claim.owner = 'user · esone.qiu · 用户已确认';
          claim.mode = 'user-confirmed decision';
          claim.confidence = '确定 · 用户纠正优先于自动判断';
          claim.writeTitle = '允许进入事实候选';
          claim.write =
            '已升级为用户明确决定候选；仍受时间、冲突和现有确认策略约束，不会静默覆盖更晚的决定。';
          claim.allowed = true;
          showToast('已修正归属：这是你的决定。原文未改，已更新派生写入权限。');
        }
        refreshClaimNodes(scene);
        renderRail(scene);
      }

      function bindActions() {
        const scene = scenes[activeScene];
        document.querySelectorAll('[data-claim-id]').forEach((node) => {
          node.addEventListener('click', () => selectClaim(node.dataset.claimId));
        });
        document
          .getElementById('rememberButton')
          ?.addEventListener('click', () => {
            document.getElementById('memoryReceipt')?.classList.add('visible');
            if (activeScene === 'ask') {
              showToast('已展开本次回答的归属回执；这只是 Demo，不会写入真实记忆。');
            } else {
              showToast('原文已留存，分层写入权限已应用；这只是 Demo，不会写入真实记忆。');
            }
          });
        document
          .getElementById('closeRail')
          ?.addEventListener('click', () =>
            document.getElementById('memoryRail')?.classList.remove('mobile-open'),
          );
        document.querySelectorAll('[data-correction]').forEach((button) => {
          button.addEventListener('click', () =>
            applyCorrection(button.dataset.correction),
          );
        });
        selectClaim(scene.selected, false);
      }

      function renderScene(key) {
        activeScene = key;
        const scene = scenes[key];
        scenePolicy.textContent = scene.policy;
        document.querySelectorAll('.scene-tab').forEach((button) => {
          button.classList.toggle('active', button.dataset.scene === key);
          button.setAttribute(
            'aria-current',
            button.dataset.scene === key ? 'true' : 'false',
          );
        });
        stage.innerHTML = `
          <section class="browser">
            ${chromeMarkup(scene)}
            <div class="host">
              ${topbarMarkup(scene)}
              <div class="host-body">
                ${sidebarMarkup(scene)}
                ${threadMarkup(scene, key)}
                ${railMarkup()}
              </div>
            </div>
          </section>`;
        bindActions();
      }

      document.querySelectorAll('.scene-tab').forEach((button) => {
        button.addEventListener('click', () => renderScene(button.dataset.scene));
      });

      renderScene('mixed');
    </script>
  </body>
</html>
