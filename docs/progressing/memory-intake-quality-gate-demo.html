<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal AI - 记忆录入质检台</title>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
      :root {
        --bg: #f6f7f8;
        --surface: #ffffff;
        --surface-soft: #f0f4f5;
        --ink: #182225;
        --muted: #667579;
        --line: #dce4e6;
        --teal: #0f766e;
        --teal-soft: #dff5f1;
        --amber: #b7791f;
        --amber-soft: #fff3d6;
        --red: #b42318;
        --red-soft: #fee4e2;
        --blue: #2563eb;
        --blue-soft: #e7efff;
        --green: #287a45;
        --green-soft: #e4f6e9;
        --shadow: 0 18px 60px rgba(24, 34, 37, 0.1);
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        letter-spacing: 0;
      }

      button,
      input {
        font: inherit;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 248px minmax(0, 1fr);
      }

      .sidebar {
        background: #182225;
        color: #dce4e6;
        padding: 22px 16px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 8px;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: linear-gradient(135deg, #42c8b7, #eef4a6);
        display: grid;
        place-items: center;
        color: #102022;
        font-weight: 800;
      }

      .brand-title {
        font-size: 15px;
        font-weight: 760;
      }

      .brand-subtitle {
        margin-top: 2px;
        color: #9badb2;
        font-size: 12px;
      }

      .nav-section-title {
        padding: 0 8px;
        color: #8da1a6;
        font-size: 11px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .nav {
        display: grid;
        gap: 3px;
      }

      .nav-item {
        border: 0;
        color: #dce4e6;
        background: transparent;
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 9px;
        border-radius: 7px;
        cursor: default;
        text-align: left;
      }

      .nav-item svg {
        width: 17px;
        height: 17px;
        color: #9badb2;
      }

      .nav-item.active {
        background: rgba(66, 200, 183, 0.16);
        color: #ffffff;
      }

      .nav-item.active svg {
        color: #7ee0d1;
      }

      .sidebar-foot {
        margin-top: auto;
        padding: 12px;
        border: 1px solid rgba(220, 228, 230, 0.12);
        border-radius: 8px;
        color: #b9c8cb;
        font-size: 12px;
        line-height: 1.5;
      }

      .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
        padding: 14px 26px;
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .title-block {
        min-width: 0;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
      }

      .subtitle {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
      }

      .topbar-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .search {
        position: relative;
        width: 280px;
      }

      .search svg {
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        color: var(--muted);
      }

      .search input {
        width: 100%;
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 0 12px 0 34px;
        background: #ffffff;
        outline: none;
      }

      .icon-btn,
      .primary-btn,
      .ghost-btn {
        height: 38px;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        cursor: pointer;
      }

      .icon-btn {
        width: 38px;
        justify-content: center;
        padding: 0;
      }

      .icon-btn svg,
      .primary-btn svg,
      .ghost-btn svg {
        width: 16px;
        height: 16px;
      }

      .primary-btn {
        background: var(--teal);
        border-color: var(--teal);
        color: #ffffff;
      }

      .ghost-btn {
        color: var(--teal);
      }

      .content {
        padding: 22px 26px 30px;
        display: grid;
        gap: 18px;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(140px, 1fr));
        gap: 12px;
      }

      .stat-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        min-height: 94px;
      }

      .stat-label {
        color: var(--muted);
        font-size: 12px;
      }

      .stat-value {
        margin-top: 8px;
        font-size: 26px;
        font-weight: 780;
      }

      .stat-note {
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .workbench {
        display: grid;
        grid-template-columns: minmax(360px, 42%) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 1px 0 rgba(24, 34, 37, 0.02);
        min-width: 0;
      }

      .panel-head {
        padding: 15px 16px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .panel-title {
        font-weight: 760;
      }

      .panel-meta {
        color: var(--muted);
        font-size: 12px;
      }

      .filters {
        padding: 12px 14px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--line);
      }

      .chip {
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--muted);
        border-radius: 999px;
        height: 30px;
        padding: 0 11px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        font-size: 12px;
      }

      .chip.active {
        background: var(--teal-soft);
        border-color: rgba(15, 118, 110, 0.25);
        color: var(--teal);
        font-weight: 700;
      }

      .queue {
        display: grid;
        max-height: calc(100vh - 292px);
        overflow: auto;
      }

      .queue-item {
        border: 0;
        border-bottom: 1px solid var(--line);
        background: #ffffff;
        text-align: left;
        padding: 14px 15px;
        cursor: pointer;
        display: grid;
        gap: 9px;
      }

      .queue-item:hover,
      .queue-item.active {
        background: #f7fbfb;
      }

      .queue-item.active {
        box-shadow: inset 4px 0 0 var(--teal);
      }

      .queue-title-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }

      .queue-title {
        font-weight: 720;
        line-height: 1.35;
        flex: 1;
      }

      .badge {
        border-radius: 999px;
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 720;
        white-space: nowrap;
      }

      .badge.amber {
        background: var(--amber-soft);
        color: var(--amber);
      }

      .badge.red {
        background: var(--red-soft);
        color: var(--red);
      }

      .badge.teal {
        background: var(--teal-soft);
        color: var(--teal);
      }

      .badge.blue {
        background: var(--blue-soft);
        color: var(--blue);
      }

      .badge.green {
        background: var(--green-soft);
        color: var(--green);
      }

      .queue-snippet {
        color: var(--muted);
        line-height: 1.45;
        font-size: 13px;
      }

      .queue-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .source-line {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .source-line svg {
        width: 14px;
        height: 14px;
      }

      .detail {
        display: grid;
        gap: 16px;
        padding: 16px;
      }

      .detail-hero {
        display: grid;
        gap: 12px;
      }

      .detail-title-row {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      .detail-title {
        font-size: 20px;
        line-height: 1.25;
        font-weight: 800;
        flex: 1;
      }

      .action-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .subpanel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfc;
        padding: 13px;
        min-width: 0;
      }

      .subpanel-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 760;
        margin-bottom: 10px;
      }

      .subpanel-title svg {
        width: 15px;
        height: 15px;
        color: var(--teal);
      }

      .reason-list,
      .impact-list,
      .takeaway-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 8px;
      }

      .reason-list li,
      .impact-list li,
      .takeaway-list li {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        color: #344245;
        line-height: 1.45;
        font-size: 13px;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 99px;
        background: var(--teal);
        margin-top: 6px;
        flex: 0 0 auto;
      }

      .dot.amber {
        background: var(--amber);
      }

      .dot.red {
        background: var(--red);
      }

      .raw-box {
        border: 1px solid var(--line);
        background: #10181a;
        color: #d8e5e7;
        border-radius: 8px;
        padding: 13px;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 12px;
        line-height: 1.55;
        max-height: 150px;
        overflow: auto;
        white-space: pre-wrap;
      }

      .repair-preview {
        display: grid;
        gap: 10px;
      }

      .repair-card {
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
      }

      .repair-card-title {
        font-weight: 760;
        margin-bottom: 8px;
      }

      .timeline {
        display: grid;
        gap: 8px;
      }

      .timeline-row {
        display: grid;
        grid-template-columns: 86px 1fr;
        gap: 10px;
        align-items: start;
        font-size: 13px;
      }

      .timeline-label {
        color: var(--muted);
      }

      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        background: #182225;
        color: #ffffff;
        border-radius: 8px;
        padding: 13px 15px;
        box-shadow: var(--shadow);
        display: none;
        align-items: center;
        gap: 10px;
        z-index: 10;
        max-width: min(420px, calc(100vw - 32px));
      }

      .toast.show {
        display: flex;
      }

      .toast svg {
        width: 17px;
        height: 17px;
        color: #7ee0d1;
      }

      .empty-state {
        padding: 24px;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 1180px) {
        .stats-grid {
          grid-template-columns: repeat(3, minmax(150px, 1fr));
        }

        .workbench {
          grid-template-columns: 1fr;
        }

        .queue {
          max-height: 520px;
        }
      }

      @media (max-width: 840px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          display: none;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
          padding: 14px 16px;
        }

        .topbar-actions {
          width: 100%;
          margin-left: 0;
          flex-wrap: wrap;
        }

        .search {
          width: 100%;
        }

        .content {
          padding: 16px;
        }

        .stats-grid {
          grid-template-columns: 1fr 1fr;
        }

        .detail-grid {
          grid-template-columns: 1fr;
        }

        .detail-title-row {
          flex-direction: column;
        }
      }

      @media (max-width: 520px) {
        .stats-grid {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 19px;
        }

        .primary-btn,
        .ghost-btn {
          width: 100%;
          justify-content: center;
        }

        .queue-foot {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">PA</div>
          <div>
            <div class="brand-title">Personal AI</div>
            <div class="brand-subtitle">Memory Exploring</div>
          </div>
        </div>

        <div>
          <div class="nav-section-title">今日</div>
          <div class="nav">
            <button class="nav-item"><i data-lucide="compass"></i><span>今日领航</span></button>
            <button class="nav-item"><i data-lucide="message-square"></i><span>消息与话题</span></button>
            <button class="nav-item"><i data-lucide="calendar-days"></i><span>会议准备</span></button>
          </div>
        </div>

        <div>
          <div class="nav-section-title">记忆系统</div>
          <div class="nav">
            <button class="nav-item"><i data-lucide="search"></i><span>搜索记忆</span></button>
            <button class="nav-item"><i data-lucide="map"></i><span>覆盖地图</span></button>
            <button class="nav-item active"><i data-lucide="filter-check"></i><span>录入质检</span></button>
            <button class="nav-item"><i data-lucide="git-branch"></i><span>关系雷达</span></button>
            <button class="nav-item"><i data-lucide="list-checks"></i><span>决策中心</span></button>
          </div>
        </div>

        <div class="sidebar-foot">
          当前用户空间：esone.qiu<br />
          只处理进入自动召回前的质量状态；原始记录不会被静默删除。
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="title-block">
            <h1>记忆录入质检台</h1>
            <div class="subtitle">把低信息、重复和网页壳文本拦在自动召回之前</div>
          </div>
          <div class="topbar-actions">
            <label class="search">
              <i data-lucide="search"></i>
              <input id="searchInput" placeholder="搜索来源、原因、项目" />
            </label>
            <button class="ghost-btn" id="rulesBtn"><i data-lucide="sliders-horizontal"></i>规则</button>
            <button class="primary-btn" id="batchApply"><i data-lucide="check-check"></i>应用推荐处理</button>
          </div>
        </header>

        <section class="content">
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">待处理</div>
              <div class="stat-value" id="statPending">18</div>
              <div class="stat-note">最近 7 天高影响项</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">可自动合并</div>
              <div class="stat-value">7</div>
              <div class="stat-note">Jira / 网页近重复</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">建议仅保留原始</div>
              <div class="stat-value">5</div>
              <div class="stat-note">空会议和低信息记录</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">可修复摘要</div>
              <div class="stat-value">4</div>
              <div class="stat-note">长线程变成高信号记忆</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">减少自动噪声</div>
              <div class="stat-value" id="statNoise">31%</div>
              <div class="stat-note">Ask / Lens 证据池预估</div>
            </div>
          </div>

          <div class="workbench">
            <section class="panel">
              <div class="panel-head">
                <div>
                  <div class="panel-title">质检队列</div>
                  <div class="panel-meta">按下游召回影响排序</div>
                </div>
                <span class="badge teal" id="queueCount">5 项</span>
              </div>
              <div class="filters" id="filters">
                <button class="chip active" data-filter="all">全部</button>
                <button class="chip" data-filter="low">低信息</button>
                <button class="chip" data-filter="duplicate">重复</button>
                <button class="chip" data-filter="repair">可修复</button>
                <button class="chip" data-filter="weak">弱推断</button>
                <button class="chip" data-filter="source">来源异常</button>
              </div>
              <div class="queue" id="queue"></div>
            </section>

            <section class="panel">
              <div class="panel-head">
                <div>
                  <div class="panel-title">处理详情</div>
                  <div class="panel-meta" id="detailMeta">选择一条记忆查看原因和影响</div>
                </div>
                <button class="icon-btn" id="undoBtn" aria-label="撤销上次处理">
                  <i data-lucide="rotate-ccw"></i>
                </button>
              </div>
              <div class="detail" id="detail"></div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast">
      <i data-lucide="check-circle"></i>
      <span id="toastText">已处理</span>
    </div>

    <script>
      const items = [
        {
          id: "meeting-empty",
          filter: "low",
          title: "Meeting Pilot 空会议记录",
          badge: ["建议仅保留原始", "amber"],
          source: "RingCentral Video · 2026-05-29 14:05",
          snippet: "摘要只有 Meeting Pilot is recording this meeting，决议和行动项均为空。",
          action: "仅保留原始记录",
          state: "低信息",
          score: 0.28,
          raw:
            "## 会议: Meeting Pilot is recording this meeting\\n日期: 2026-05-29T06:05:35.705Z\\n参会者: HZ - Liuheta, XMN - Bailuzhou, Bribin Zheng, Niki Rao, Patricia Li, Esone Qiu (You)\\n\\n### 摘要\\nMeeting Pilot is recording this meeting.\\n\\n### 决议\\n- 暂无\\n\\n### 行动项\\n- 暂无",
          reasons: [
            ["red", "会议没有可用讨论内容，决议和行动项均为空"],
            ["amber", "标题和摘要是录制状态提示，不是会议结论"],
            ["teal", "参会者和时间仍可保留为原始证据"]
          ],
          impact: [
            "Memory Lens 不再在空会议页面自动弹出这条记录",
            "Ask 查询当天会议时会说明只有元数据，没有可靠内容",
            "如果后续 transcript 到达，可自动合并回真实会议"
          ],
          repair: ["保留会议时间、参会者和来源链接", "自动召回优先级从 normal 降为 hidden", "精确搜索和历史页面仍可查看"]
        },
        {
          id: "jira-duplicate",
          filter: "duplicate",
          title: "MTR-141911 Jira 评论重复抓取",
          badge: ["合并重复", "red"],
          source: "Jira · MTR-141911",
          snippet: "多条 source memory 包含相同 Collapse comment / Expand comment 壳文本。",
          action: "合并为 canonical 记忆",
          state: "重复",
          score: 0.34,
          raw:
            "Collapse comment: Esone Qiu added a comment - 12/01/25 02:03 PM - Restricted to Managers\\nEsone's AI: I will help to set the Team copied from parent.\\nEdit Delete Pin Expand comment...",
          reasons: [
            ["red", "同一 ticket、同一时间窗口、同一评论结构出现 4 次"],
            ["amber", "页面展开/折叠按钮和权限文案占比过高"],
            ["teal", "AI 自动补 Team / Component / Story Point 的事实可保留"]
          ],
          impact: [
            "Ask / Search 只返回一条 canonical Jira 操作记忆",
            "证据展开里保留 4 条原始评论 receipt",
            "后续同 fingerprint 评论直接并入 duplicate group"
          ],
          repair: ["MTR-141911 曾由 Esone's AI 自动补充 Story Point、Team、Component、Vertical Track", "来源：4 条 Jira comment", "自动召回优先使用 canonical 摘要"]
        },
        {
          id: "whatsapp-thread",
          filter: "repair",
          title: "WhatsApp 产品讨论长线程",
          badge: ["修复成摘要", "teal"],
          source: "RingCentral · Nova / WhatsApp product discussion",
          snippet: "原文有价值，但夹杂群组 UI、长列表和上下文切换。",
          action: "生成可召回摘要",
          state: "可修复",
          score: 0.62,
          raw:
            "David 的需求细节 WhatsApp Q2/GA 最小 P0 message types：Text messages，必须支持 WhatsApp 专有 RTF syntax。P0：Interactive reply buttons... P1：Interactive Flow messages...",
          reasons: [
            ["teal", "包含明确 P0/P1 scope 和 David / Barry 观点"],
            ["amber", "原文较长，直接进入上下文会挤占 token"],
            ["amber", "需要拆出 decisions、open questions、message types"]
          ],
          impact: [
            "Context Assist 插入结构化 P0/P1 摘要，而不是整段聊天",
            "Memory Lens 显示 David / Barry 的具体观点",
            "原始 RingCentral source 作为证据保留"
          ],
          repair: ["P0: Text messages、reply buttons、list messages、image messages", "P1: Flow、Template、Video、Document messages", "待确认：row descriptions、headers / footers、multiple sections"]
        },
        {
          id: "be-confirm",
          filter: "weak",
          title: "BE ready 状态重复确认项",
          badge: ["合并确认", "blue"],
          source: "Confirm Requests · property_change",
          snippet: "同一问题生成多条 status / readiness / ready_status 近似变化。",
          action: "合并为一条确认",
          state: "弱推断",
          score: 0.41,
          raw:
            'Property "status" on BE may have changed from "waiting for new design, not ready" to "not ready, waiting for new RCV BE design". Accept the new value?\\nInferred from user query: "那个 BE ready 了吗？"',
          reasons: [
            ["red", "同一 query anchor 在 24 小时内生成多条近似 property change"],
            ["amber", "候选新值语义接近，但字段名不一致"],
            ["teal", "应聚合给用户一次确认，而不是堆积 pending"]
          ],
          impact: [
            "Decision Center pending 数减少",
            "用户一次确认可关闭同 dedupe group",
            "Answer Memory Tracker 可复用统一状态"
          ],
          repair: ["旧值：waiting for new design, not ready", "推荐值：not ready, waiting for new RCV BE design", "候选来源：7 条 confirm request，均来自同一短问句"]
        },
        {
          id: "docs-chrome",
          filter: "source",
          title: "Google Docs 页面壳文本过多",
          badge: ["来源修复", "amber"],
          source: "Google Docs · Story Points estimation by AI Service",
          snippet: "抓取内容含 Restore this version、Ask Gemini、菜单栏和编辑器 chrome。",
          action: "修复来源解析",
          state: "来源异常",
          score: 0.37,
          raw:
            "Close Learn more Join chat Today, 4:01 PM Restore this version Story Points estimation by AI Service Tab in My Drive External 0 Share Ask Gemini File Edit View Insert Format Tools...",
          reasons: [
            ["amber", "页面 chrome 和工具栏文本占比过高"],
            ["amber", "正文标题可识别，但段落边界不稳定"],
            ["teal", "Google Docs source URL 和标题完整，可重新解析"]
          ],
          impact: [
            "暂不进入自动召回高优先级",
            "触发 Google Docs adapter 正文选择器修复",
            "修复后重新生成 source memory takeaways"
          ],
          repair: ["保留 source fingerprint", "等待正文解析器重跑", "当前只作为原始网页证据参与精确搜索"]
        }
      ];

      let activeFilter = "all";
      let activeId = items[0].id;
      let handled = new Set();
      let lastHandled = null;

      const queue = document.getElementById("queue");
      const detail = document.getElementById("detail");
      const queueCount = document.getElementById("queueCount");
      const statPending = document.getElementById("statPending");
      const statNoise = document.getElementById("statNoise");
      const toast = document.getElementById("toast");
      const toastText = document.getElementById("toastText");

      function visibleItems() {
        const query = document.getElementById("searchInput").value.trim().toLowerCase();
        return items.filter((item) => {
          const filterMatch = activeFilter === "all" || item.filter === activeFilter;
          const queryMatch =
            !query ||
            [item.title, item.source, item.snippet, item.state, item.action].join(" ").toLowerCase().includes(query);
          return filterMatch && queryMatch && !handled.has(item.id);
        });
      }

      function renderQueue() {
        const list = visibleItems();
        queueCount.textContent = `${list.length} 项`;
        statPending.textContent = String(18 - handled.size);
        statNoise.textContent = handled.size > 0 ? `${31 + handled.size * 4}%` : "31%";

        if (!list.length) {
          queue.innerHTML = '<div class="empty-state">当前筛选下没有待处理项</div>';
          return;
        }

        if (!list.some((item) => item.id === activeId)) {
          activeId = list[0].id;
        }

        queue.innerHTML = list
          .map(
            (item) => `
              <button class="queue-item ${item.id === activeId ? "active" : ""}" data-id="${item.id}">
                <div class="queue-title-row">
                  <div class="queue-title">${item.title}</div>
                  <span class="badge ${item.badge[1]}">${item.badge[0]}</span>
                </div>
                <div class="queue-snippet">${item.snippet}</div>
                <div class="queue-foot">
                  <span class="source-line"><i data-lucide="database"></i>${item.source}</span>
                  <span>readiness ${(item.score * 100).toFixed(0)}%</span>
                </div>
              </button>
            `
          )
          .join("");

        queue.querySelectorAll(".queue-item").forEach((button) => {
          button.addEventListener("click", () => {
            activeId = button.dataset.id;
            render();
          });
        });
      }

      function renderDetail() {
        const item = items.find((entry) => entry.id === activeId && !handled.has(entry.id)) || visibleItems()[0];
        if (!item) {
          detail.innerHTML = '<div class="empty-state">没有可查看的质检项</div>';
          document.getElementById("detailMeta").textContent = "全部处理完成";
          return;
        }
        activeId = item.id;
        document.getElementById("detailMeta").textContent = `${item.state} · ${item.source}`;
        detail.innerHTML = `
          <div class="detail-hero">
            <div class="detail-title-row">
              <div>
                <div class="detail-title">${item.title}</div>
                <div class="subtitle">${item.source}</div>
              </div>
              <span class="badge ${item.badge[1]}">${item.state}</span>
            </div>
            <div class="action-row">
              <button class="primary-btn" id="applyOne"><i data-lucide="check"></i>${item.action}</button>
              <button class="ghost-btn" id="keepOne"><i data-lucide="archive"></i>仅保留原始证据</button>
              <button class="ghost-btn" id="markReady"><i data-lucide="shield-check"></i>设为可召回</button>
            </div>
          </div>

          <div class="detail-grid">
            <div class="subpanel">
              <div class="subpanel-title"><i data-lucide="scan-search"></i>原始片段</div>
              <div class="raw-box">${escapeHtml(item.raw)}</div>
            </div>
            <div class="subpanel">
              <div class="subpanel-title"><i data-lucide="list-filter"></i>质检原因</div>
              <ul class="reason-list">
                ${item.reasons
                  .map(([tone, text]) => `<li><span class="dot ${tone}"></span><span>${text}</span></li>`)
                  .join("")}
              </ul>
            </div>
          </div>

          <div class="detail-grid">
            <div class="subpanel">
              <div class="subpanel-title"><i data-lucide="wand-sparkles"></i>处理预览</div>
              <div class="repair-preview">
                <div class="repair-card">
                  <div class="repair-card-title">${item.action}</div>
                  <ul class="takeaway-list">
                    ${item.repair.map((text) => `<li><span class="dot"></span><span>${text}</span></li>`).join("")}
                  </ul>
                </div>
              </div>
            </div>
            <div class="subpanel">
              <div class="subpanel-title"><i data-lucide="activity"></i>召回影响</div>
              <ul class="impact-list">
                ${item.impact.map((text) => `<li><span class="dot amber"></span><span>${text}</span></li>`).join("")}
              </ul>
            </div>
          </div>

          <div class="subpanel">
            <div class="subpanel-title"><i data-lucide="history"></i>处理 receipt</div>
            <div class="timeline">
              <div class="timeline-row"><div class="timeline-label">当前状态</div><div>${item.state} · pending</div></div>
              <div class="timeline-row"><div class="timeline-label">推荐动作</div><div>${item.action}</div></div>
              <div class="timeline-row"><div class="timeline-label">回滚路径</div><div>处理后 30 天内可撤销；原始证据始终保留。</div></div>
            </div>
          </div>
        `;

        document.getElementById("applyOne").addEventListener("click", () => applyItem(item, item.action));
        document.getElementById("keepOne").addEventListener("click", () => applyItem(item, "仅保留原始证据"));
        document.getElementById("markReady").addEventListener("click", () => applyItem(item, "设为可召回"));
      }

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function applyItem(item, action) {
        handled.add(item.id);
        lastHandled = item.id;
        showToast(`${action}：${item.title}`);
        render();
      }

      function showToast(message) {
        toastText.textContent = message;
        toast.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2600);
      }

      function render() {
        renderQueue();
        renderDetail();
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }

      document.getElementById("filters").addEventListener("click", (event) => {
        const button = event.target.closest(".chip");
        if (!button) return;
        activeFilter = button.dataset.filter;
        document.querySelectorAll(".chip").forEach((chip) => chip.classList.toggle("active", chip === button));
        render();
      });

      document.getElementById("searchInput").addEventListener("input", render);

      document.getElementById("batchApply").addEventListener("click", () => {
        const list = visibleItems();
        list.slice(0, 3).forEach((item) => {
          handled.add(item.id);
          lastHandled = item.id;
        });
        showToast(`已应用 ${Math.min(3, list.length)} 条推荐处理`);
        render();
      });

      document.getElementById("undoBtn").addEventListener("click", () => {
        if (!lastHandled) {
          showToast("没有可撤销的处理");
          return;
        }
        handled.delete(lastHandled);
        activeId = lastHandled;
        const restored = items.find((item) => item.id === lastHandled);
        lastHandled = null;
        showToast(`已撤销：${restored.title}`);
        render();
      });

      document.getElementById("rulesBtn").addEventListener("click", () => {
        showToast("规则：空会议隐藏、Jira 重复合并、长线程生成摘要");
      });

      render();
    </script>
  </body>
</html>
