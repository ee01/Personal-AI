<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>项目进展 · 空间导航版</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #1a1a2e;
      --card: #16213e;
      --accent: #00d9ff;
      --accent-warm: #ff6b6b;
      --accent-green: #4ecdc4;
      --text: #e6e6e6;
      --text-dim: #8892b0;
      --glow: rgba(0, 217, 255, 0.3);
      --shadow: 0 20px 40px rgba(0,0,0,0.6);
      --dep-color: #ff6b6b;
      --epic-color: #4ecdc4;
      --design-color: #feca57;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--bg), #0f0f23);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      user-select: none;
    }

    .universe {
      position: relative;
      width: 100vw;
      height: 100vh;
      perspective: 2000px;
      overflow: hidden;
      cursor: grab;
    }

    .universe:active { cursor: grabbing; }

    .space {
      position: absolute;
      width: 300vw;
      height: 300vh;
      transform-origin: center center;
      transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform: translate3d(-100vw, -100vh, 0) scale(1);
    }

    .hud {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      display: flex;
      gap: 15px;
      pointer-events: none;
    }

    .hud-panel {
      background: rgba(26, 26, 46, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: var(--shadow);
      pointer-events: auto;
      font-size: 14px;
      color: var(--accent);
      font-weight: 600;
    }

    .zoom-controls {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .zoom-btn {
      width: 50px;
      height: 50px;
      background: var(--surface);
      border: 2px solid var(--accent);
      border-radius: 50%;
      color: var(--accent);
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
    }

    .zoom-btn:hover {
      background: var(--accent);
      color: var(--bg);
      transform: scale(1.1);
      box-shadow: 0 0 30px var(--glow);
    }

    .project-galaxy {
      position: absolute;
      min-width: 800px;
      min-height: 400px;
      margin: 100px;
    }

    .project-node {
      position: relative;
      background: var(--card);
      border: 2px solid var(--accent);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 15px 35px rgba(0, 217, 255, 0.2);
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform-style: preserve-3d;
      margin-bottom: 150px;
    }

    .project-node:hover {
      transform: translateY(-10px) rotateX(5deg);
      box-shadow: 0 25px 50px rgba(0, 217, 255, 0.4);
      border-color: var(--accent-warm);
    }

    .project-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 15px;
      text-shadow: 0 0 20px var(--glow);
    }

    .timeline-spine {
      position: relative;
      height: 6px;
      background: linear-gradient(90deg, var(--dep-color), var(--accent), var(--epic-color));
      border-radius: 3px;
      margin: 30px 0;
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
    }

    .milestone {
      position: absolute;
      top: -15px;
      transform: translateX(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .milestone.beta {
      background: var(--accent-green);
      color: var(--bg);
    }

    .milestone.ga {
      background: var(--accent);
      color: var(--bg);
    }

    .milestone:hover {
      transform: translateX(-50%) scale(1.2);
      box-shadow: 0 0 25px currentColor;
    }

    .task-branch {
      position: absolute;
      width: 280px;
      background: var(--surface);
      border: 1px solid var(--text-dim);
      border-radius: 15px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.4s ease;
      transform-origin: center bottom;
      opacity: 0.9;
    }

    .task-branch.dep {
      border-color: var(--dep-color);
      top: -120px;
    }

    .task-branch.epic {
      border-color: var(--epic-color);
      top: 60px;
    }

    .task-branch.design {
      border-color: var(--design-color);
      top: -80px;
      left: -150px;
      transform: rotate(-45deg);
      transform-origin: right bottom;
    }

    .task-branch:hover {
      transform: translateY(-8px) scale(1.05);
      opacity: 1;
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    }

    .task-branch.dep:hover { box-shadow: 0 15px 30px rgba(255, 107, 107, 0.3); }
    .task-branch.epic:hover { box-shadow: 0 15px 30px rgba(78, 205, 196, 0.3); }
    .task-branch.design:hover { box-shadow: 0 15px 30px rgba(254, 202, 87, 0.3); }

    .task-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .task-meta {
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .status-badge {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
    }

    .status-progress { background: #3498db; color: white; }
    .status-review { background: #9b59b6; color: white; }
    .status-done { background: #2ecc71; color: white; }
    .status-blocked { background: #e74c3c; color: white; }
    .status-pending { background: #f39c12; color: white; }

    .platforms {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }

    .platform-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      position: relative;
    }

    .platform-dot.done { background: #2ecc71; }
    .platform-dot.progress { background: #3498db; }
    .platform-dot.pending { background: #95a5a6; }

    .detail-zoom {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 10, 15, 0.95);
      backdrop-filter: blur(10px);
      z-index: 2000;
      display: none;
      opacity: 0;
      transition: all 0.5s ease;
    }

    .detail-zoom.active {
      display: flex;
      opacity: 1;
    }

    .detail-container {
      margin: auto;
      background: var(--card);
      border: 2px solid var(--accent);
      border-radius: 25px;
      padding: 40px;
      max-width: 80vw;
      max-height: 80vh;
      overflow-y: auto;
      transform: scale(0.8);
      transition: transform 0.5s ease;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    }

    .detail-zoom.active .detail-container {
      transform: scale(1);
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .detail-title {
      font-size: 32px;
      color: var(--accent);
      text-shadow: 0 0 20px var(--glow);
    }

    .close-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: var(--accent-warm);
      color: white;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
    }

    .detail-section {
      margin-bottom: 25px;
      padding: 20px;
      background: var(--surface);
      border-radius: 15px;
      border-left: 4px solid var(--accent);
    }

    .section-title {
      font-size: 18px;
      color: var(--accent);
      margin-bottom: 15px;
    }

    .jira-links, .chat-logs {
      color: var(--text-dim);
      line-height: 1.6;
    }

    .jira-link {
      display: block;
      color: var(--accent);
      text-decoration: none;
      margin: 5px 0;
      padding: 8px;
      background: rgba(0, 217, 255, 0.1);
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .jira-link:hover {
      background: rgba(0, 217, 255, 0.2);
      transform: translateX(5px);
    }

    .chat-message {
      padding: 10px;
      margin: 8px 0;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      border-left: 3px solid var(--accent-green);
    }

    .chat-author {
      font-weight: 600;
      color: var(--accent-green);
      font-size: 12px;
    }

    .minimap {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 200px;
      height: 120px;
      background: rgba(26, 26, 46, 0.9);
      border: 1px solid var(--accent);
      border-radius: 10px;
      z-index: 1000;
      backdrop-filter: blur(20px);
    }

    .minimap-content {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .minimap-project {
      position: absolute;
      width: 30px;
      height: 15px;
      background: var(--accent);
      border-radius: 3px;
      opacity: 0.7;
    }

    /* 粒子效果 */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.6;
      animation: float 20s infinite linear;
    }

    @keyframes float {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-10vh) translateX(100px); opacity: 0; }
    }

    .connection-line {
      position: absolute;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.3;
      animation: pulse 3s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  
  <div class="hud">
    <div class="hud-panel">项目总数: <span id="projectCount">3</span></div>
    <div class="hud-panel">缩放: <span id="zoomLevel">100%</span></div>
    <div class="hud-panel">模式: <span id="viewMode">全景</span></div>
  </div>

  <div class="minimap">
    <div class="minimap-content" id="minimapContent"></div>
  </div>

  <div class="universe" id="universe">
    <div class="space" id="space">
      <!-- 项目内容将在这里动态生成 -->
    </div>
  </div>

  <div class="zoom-controls">
    <button class="zoom-btn" id="zoomIn">+</button>
    <button class="zoom-btn" id="zoomOut">−</button>
    <button class="zoom-btn" id="resetView">⌂</button>
  </div>

  <div class="detail-zoom" id="detailZoom">
    <div class="detail-container">
      <div class="detail-header">
        <h2 class="detail-title" id="detailTitle">任务详情</h2>
        <button class="close-btn" id="closeDetail">×</button>
      </div>
      <div id="detailContent"></div>
    </div>
  </div>

  <script>
    // 数据结构
    const projectData = [
      {
        id: 'p1',
        name: 'Project 1',
        position: { x: 0, y: 0 },
        milestones: {
          beta: { percent: 25, date: '2025-05-05' },
          ga: { percent: 80, date: '2025-06-10' }
        },
        tasks: [
          {
            id: 't1',
            type: 'dep',
            title: 'BE dependency',
            percent: 20,
            status: 'progress',
            eta: '2025-05-02',
            desc: 'RCV-xxxx BUG FOR XXX',
            jira: ['PROJ-1234', 'PROJ-1235'],
            chats: [
              { author: 'Alice', message: '后端API已经准备好了', time: '10:30' },
              { author: 'Bob', message: '需要确认数据格式', time: '10:45' }
            ],
            platforms: null
          },
          {
            id: 't2',
            type: 'design',
            title: 'Design',
            percent: 15,
            status: 'progress',
            eta: '2025-04-20',
            desc: 'UI/UX设计方案',
            jira: ['DESIGN-101'],
            chats: [
              { author: 'Designer', message: '原型图已更新', time: '14:20' }
            ],
            platforms: null
          },
          {
            id: 't3',
            type: 'epic',
            title: 'Epic 1',
            percent: 45,
            status: 'review',
            eta: '2025-04-24',
            desc: 'JIRA: E1-1234',
            jira: ['E1-1234', 'E1-1235'],
            chats: [
              { author: 'Dev1', message: 'iOS版本已完成', time: '16:30' },
              { author: 'QA', message: '测试中发现bug', time: '17:00' }
            ],
            platforms: { sdk: 'done', ios: 'done', android: 'progress', qa: 'progress' }
          },
          {
            id: 't4',
            type: 'epic',
            title: 'Epic 2',
            percent: 70,
            status: 'done',
            eta: '2025-04-30',
            desc: 'JIRA: E2-5678',
            jira: ['E2-5678'],
            chats: [
              { author: 'PM', message: '已发布到生产环境', time: '18:00' }
            ],
            platforms: { sdk: 'done', ios: 'done', android: 'done', qa: 'done' }
          }
        ]
      },
      {
        id: 'p2',
        name: 'Project 2',
        position: { x: 0, y: 600 },
        milestones: {
          beta: { percent: 30, date: '2025-04-15' },
          ga: { percent: 85, date: '2025-06-30' }
        },
        tasks: [
          {
            id: 't5',
            type: 'epic',
            title: 'Epic A',
            percent: 35,
            status: 'progress',
            eta: '2025-04-20',
            desc: 'Frontend重构',
            jira: ['EA-100'],
            chats: [
              { author: 'Frontend', message: '新架构设计完成', time: '09:15' }
            ],
            platforms: { sdk: 'progress', ios: 'pending', android: 'pending', qa: 'pending' }
          },
          {
            id: 't6',
            type: 'dep',
            title: 'BE API v2',
            percent: 55,
            status: 'blocked',
            eta: '2025-05-01',
            desc: '等待网关升级',
            jira: ['API-200'],
            chats: [
              { author: 'Backend', message: '网关团队延期了', time: '11:30' }
            ],
            platforms: null
          }
        ]
      }
    ];

    // 全局状态
    let currentZoom = 1;
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let spacePosition = { x: -100, y: -100 }; // vw/vh units

    // DOM 元素
    const universe = document.getElementById('universe');
    const space = document.getElementById('space');
    const detailZoom = document.getElementById('detailZoom');
    const zoomLevel = document.getElementById('zoomLevel');
    const viewMode = document.getElementById('viewMode');

    // 初始化
    function init() {
      createParticles();
      renderProjects();
      setupEventListeners();
      updateMinimap();
    }

    // 创建粒子效果
    function createParticles() {
      const particles = document.getElementById('particles');
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + 'vw';
        particle.style.animationDelay = Math.random() * 20 + 's';
        particle.style.animationDuration = (15 + Math.random() * 10) + 's';
        particles.appendChild(particle);
      }
    }

    // 渲染项目
    function renderProjects() {
      space.innerHTML = '';
      
      projectData.forEach((project, index) => {
        const projectElement = createProjectNode(project);
        projectElement.style.left = project.position.x + 'px';
        projectElement.style.top = project.position.y + 'px';
        space.appendChild(projectElement);
      });
    }

    // 创建项目节点
    function createProjectNode(project) {
      const node = document.createElement('div');
      node.className = 'project-galaxy';
      node.innerHTML = `
        <div class="project-node" data-project="${project.id}">
          <h2 class="project-title">${project.name}</h2>
          <div class="timeline-spine">
            <div class="milestone beta" style="left: ${project.milestones.beta.percent}%">β</div>
            <div class="milestone ga" style="left: ${project.milestones.ga.percent}%">GA</div>
          </div>
        </div>
      `;

      // 添加任务分支
      const projectNode = node.querySelector('.project-node');
      project.tasks.forEach(task => {
        const taskElement = createTaskBranch(task);
        projectNode.appendChild(taskElement);
      });

      return node;
    }

    // 创建任务分支
    function createTaskBranch(task) {
      const branch = document.createElement('div');
      branch.className = `task-branch ${task.type}`;
      branch.style.left = task.percent + '%';
      branch.dataset.taskId = task.id;

      let platformsHtml = '';
      if (task.platforms) {
        const platforms = Object.entries(task.platforms);
        platformsHtml = `
          <div class="platforms">
            ${platforms.map(([name, status]) => 
              `<div class="platform-dot ${status}" title="${name.toUpperCase()}: ${status}"></div>`
            ).join('')}
          </div>
        `;
      }

      branch.innerHTML = `
        <div class="task-title">${task.title}</div>
        <div class="task-meta">
          <span class="status-badge status-${task.status}">${task.status}</span>
          <span>ETA: ${task.eta}</span>
        </div>
        ${platformsHtml}
      `;

      branch.addEventListener('click', (e) => {
        e.stopPropagation();
        zoomToTask(task);
      });

      return branch;
    }

    // 缩放到任务详情
    function zoomToTask(task) {
      detailZoom.classList.add('active');
      document.getElementById('detailTitle').textContent = task.title;
      
      const content = `
        <div class="detail-section">
          <h3 class="section-title">基本信息</h3>
          <p><strong>状态:</strong> ${task.status}</p>
          <p><strong>ETA:</strong> ${task.eta}</p>
          <p><strong>描述:</strong> ${task.desc}</p>
          ${task.platforms ? `
            <div style="margin-top: 15px;">
              <strong>平台进展:</strong>
              <div style="margin-top: 8px; display: flex; gap: 15px;">
                ${Object.entries(task.platforms).map(([name, status]) => 
                  `<span style="padding: 5px 10px; background: var(--surface); border-radius: 8px;">
                    ${name.toUpperCase()}: <span class="status-badge status-${status}">${status}</span>
                  </span>`
                ).join('')}
              </div>
            </div>
          ` : ''}
        </div>
        
        <div class="detail-section">
          <h3 class="section-title">关联 JIRA</h3>
          <div class="jira-links">
            ${task.jira.map(jira => 
              `<a href="#" class="jira-link">🎯 ${jira} - 点击查看详情</a>`
            ).join('')}
          </div>
        </div>
        
        <div class="detail-section">
          <h3 class="section-title">团队讨论</h3>
          <div class="chat-logs">
            ${task.chats.map(chat => 
              `<div class="chat-message">
                <div class="chat-author">${chat.author} · ${chat.time}</div>
                <div>${chat.message}</div>
              </div>`
            ).join('')}
          </div>
        </div>
      `;
      
      document.getElementById('detailContent').innerHTML = content;
      viewMode.textContent = '任务详情';
    }

    // 设置事件监听
    function setupEventListeners() {
      // 拖拽导航
      universe.addEventListener('mousedown', startDrag);
      universe.addEventListener('mousemove', drag);
      universe.addEventListener('mouseup', endDrag);
      universe.addEventListener('mouseleave', endDrag);

      // 滚轮缩放
      universe.addEventListener('wheel', handleWheel);

      // 缩放控制
      document.getElementById('zoomIn').addEventListener('click', () => zoom(1.2));
      document.getElementById('zoomOut').addEventListener('click', () => zoom(0.8));
      document.getElementById('resetView').addEventListener('click', resetView);

      // 关闭详情
      document.getElementById('closeDetail').addEventListener('click', closeDetail);
      detailZoom.addEventListener('click', (e) => {
        if (e.target === detailZoom) closeDetail();
      });

      // 键盘快捷键
      document.addEventListener('keydown', handleKeyboard);
    }

    function startDrag(e) {
      if (e.target.closest('.task-branch') || e.target.closest('.milestone')) return;
      isDragging = true;
      dragStart.x = e.clientX;
      dragStart.y = e.clientY;
      universe.style.cursor = 'grabbing';
    }

    function drag(e) {
      if (!isDragging) return;
      const deltaX = (e.clientX - dragStart.x) * 0.1;
      const deltaY = (e.clientY - dragStart.y) * 0.1;
      
      spacePosition.x += deltaX;
      spacePosition.y += deltaY;
      
      updateSpaceTransform();
      
      dragStart.x = e.clientX;
      dragStart.y = e.clientY;
    }

    function endDrag() {
      isDragging = false;
      universe.style.cursor = 'grab';
    }

    function handleWheel(e) {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      zoom(zoomFactor);
    }

    function zoom(factor) {
      currentZoom *= factor;
      currentZoom = Math.max(0.2, Math.min(3, currentZoom));
      updateSpaceTransform();
      zoomLevel.textContent = Math.round(currentZoom * 100) + '%';
      
      if (currentZoom < 0.5) {
        viewMode.textContent = '全景视图';
      } else if (currentZoom > 1.5) {
        viewMode.textContent = '细节视图';
      } else {
        viewMode.textContent = '标准视图';
      }
    }

    function updateSpaceTransform() {
      space.style.transform = `translate3d(${spacePosition.x}vw, ${spacePosition.y}vh, 0) scale(${currentZoom})`;
    }

    function resetView() {
      currentZoom = 1;
      spacePosition = { x: -100, y: -100 };
      updateSpaceTransform();
      zoomLevel.textContent = '100%';
      viewMode.textContent = '全景';
    }

    function closeDetail() {
      detailZoom.classList.remove('active');
      viewMode.textContent = '全景';
    }

    function handleKeyboard(e) {
      switch(e.key) {
        case 'Escape':
          closeDetail();
          break;
        case '=':
        case '+':
          zoom(1.2);
          break;
        case '-':
          zoom(0.8);
          break;
        case '0':
          resetView();
          break;
      }
    }

    function updateMinimap() {
      const minimap = document.getElementById('minimapContent');
      minimap.innerHTML = '';
      
      projectData.forEach((project, index) => {
        const dot = document.createElement('div');
        dot.className = 'minimap-project';
        dot.style.left = (20 + index * 40) + 'px';
        dot.style.top = (20 + index * 15) + 'px';
        minimap.appendChild(dot);
      });
    }

    // 启动应用
    init();
  </script>
</body>
</html>
